<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<title>💬 AI 튜터 · AMY Study App</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="amy-common.css">
<style>
html, body { height: 100%; overflow: hidden; }
body { display: flex; flex-direction: column; }

.tutor-topic-row {
  padding: 10px 14px;
  display: flex; gap: 6px; overflow-x: auto;
  scrollbar-width: none;
  background: rgba(22,32,50,0.5);
  border-bottom: 1px solid var(--border);
}
.tutor-topic-row::-webkit-scrollbar { display: none; }
.topic-chip {
  background: var(--card);
  border: 1.5px solid var(--border);
  color: var(--muted);
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 11.5px;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  transition: all 0.15s;
}
.topic-chip.active, .topic-chip:hover {
  background: rgba(56,189,248,0.15);
  border-color: var(--accent);
  color: var(--accent);
}

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
}

.msg {
  max-width: 88%;
  padding: 11px 14px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.55;
  word-wrap: break-word;
}
.msg.user {
  align-self: flex-end;
  background: rgba(56,189,248,0.18);
  border: 1px solid rgba(56,189,248,0.3);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.msg.assistant {
  align-self: flex-start;
  background: var(--card);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}
.msg.assistant .amy-md { font-size: 14px; }
.msg.error {
  align-self: stretch;
  background: rgba(239,68,68,0.12);
  border: 1.5px solid rgba(239,68,68,0.4);
  color: #fca5a5;
}
.msg-meta {
  font-size: 10px;
  color: var(--muted);
  margin-top: 4px;
  font-weight: 700;
}
.typing {
  display: inline-flex; gap: 4px; align-items: center;
}
.typing span {
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  animation: typing-dot 1.4s ease-in-out infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing-dot {
  0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-4px); }
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
}
.empty-state .es-icon { font-size: 60px; margin-bottom: 12px; }
.empty-state .es-title { font-size: 16px; color: var(--text); font-weight: 800; margin-bottom: 6px; }
.empty-state .es-hint { font-size: 13px; line-height: 1.6; }
.suggested {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  margin-top: 18px; max-width: 480px; margin-left: auto; margin-right: auto;
}
.suggested button {
  background: var(--card);
  border: 1.5px solid var(--border);
  color: var(--accent);
  padding: 8px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.suggested button:hover { border-color: var(--accent); background: rgba(56,189,248,0.1); }

.input-area {
  border-top: 1px solid var(--border);
  background: rgba(22,32,50,0.9);
  padding: 10px 12px;
  display: flex; gap: 8px; align-items: flex-end;
}
.input-area textarea {
  flex: 1;
  background: var(--card2);
  border: 1.5px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  border-radius: 12px;
  font-family: inherit;
  font-size: 14px;
  resize: none;
  max-height: 120px;
  min-height: 42px;
  outline: none;
  line-height: 1.4;
}
.input-area textarea:focus { border-color: var(--accent); }
.input-area .send-btn {
  background: var(--accent);
  color: var(--bg);
  border: none;
  width: 42px; height: 42px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
  font-family: inherit;
  font-weight: 800;
}
.input-area .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.clear-row {
  text-align: center; padding: 4px;
}
.clear-row button {
  background: none; border: none;
  color: var(--muted); font-size: 11px;
  cursor: pointer; font-family: inherit;
  padding: 4px 12px;
}
.clear-row button:hover { color: var(--red); }
</style>
</head>
<body>

<header class="amy-topbar">
  <a class="amy-back" href="index.html" aria-label="홈">←</a>
  <span class="amy-topbar-icon">💬</span>
  <span class="amy-topbar-title">AI 튜터</span>
  <button class="amy-key-btn" onclick="showApiKeyModal(()=>{})">🔑</button>
</header>

<div class="tutor-topic-row">
  <button class="topic-chip active" data-topic="general">📚 전체</button>
  <button class="topic-chip" data-topic="biology">🫁 호흡·혈액 8B</button>
  <button class="topic-chip" data-topic="chemistry">🧪 용해·용액 8C</button>
  <button class="topic-chip" data-topic="english">📖 English help</button>
</div>

<div class="chat-area" id="chat-area">
  <div class="empty-state" id="empty-state">
    <div class="es-icon">💬</div>
    <div class="es-title">무엇이든 물어봐!</div>
    <div class="es-hint">
      과학 개념, 단어 뜻, 문제 풀이, 영어 문법…<br>
      한국어로 물어봐도 OK
    </div>
    <div class="suggested">
      <button onclick="askSuggested('What is the difference between breathing and respiration?')">Breathing vs respiration?</button>
      <button onclick="askSuggested('Why do alveoli have thin walls?')">Why thin walls in alveoli?</button>
      <button onclick="askSuggested('포화 용액(saturated solution)이 뭐야?')">포화 용액이 뭐야?</button>
      <button onclick="askSuggested('Explain anaerobic respiration with a real-life example')">무산소 호흡 예시</button>
    </div>
  </div>
</div>

<div class="clear-row" id="clear-row" style="display:none">
  <button onclick="clearChat()">🗑️ 대화 지우기</button>
</div>

<div class="input-area">
  <textarea id="msg-input" placeholder="질문 입력… (Shift+Enter 줄바꿈)" rows="1"></textarea>
  <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
</div>

<script src="common.js"></script>
<script>
const HISTORY_KEY = 'amy_tutor_history';
let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
let currentTopic = 'general';
let sending = false;

const TOPIC_PROMPTS = {
  general: 'Help the student with any subject (Cambridge Lower Secondary Year 8 level), but specialise in Science (Biology and Chemistry) and English.',
  biology: 'The student is studying 8B Respiration (Year 8 Biology, Cambridge Lower Secondary, Hodder Education). Key topics: respiratory system organs (trachea, bronchi, bronchioles, alveoli), breathing mechanism (diaphragm, intercostal muscles), gas exchange, diffusion, aerobic and anaerobic respiration, blood components (plasma, red/white blood cells, platelets, haemoglobin), phagocytes, lymphocytes.',
  chemistry: 'The student is studying 8C Solutions (Year 8 Chemistry, Cambridge Lower Secondary). Key topics: dissolving, solute/solvent/solution, soluble/insoluble, mass conservation, concentration (concentrated vs dilute), solubility, saturated/unsaturated, effect of temperature on solubility, fair tests (independent/dependent/control variables).',
  english: 'Help the student with English language learning — grammar, vocabulary, writing tips, reading comprehension. Korean translations are welcome to clarify tough English.',
};

function buildSystem() {
  return `You are AMY, a friendly tutor for a Year 8 Korean student attending an international school in Malaysia. The student's first language is Korean and they're learning all subjects in English.

${TOPIC_PROMPTS[currentTopic]}

Rules:
- Answer in the SAME language the student uses (Korean question → Korean answer with English keywords; English question → English answer with Korean hints in parentheses for tough words).
- Use British English (haemoglobin, colour, behaviour) for Science.
- Keep answers focused and not too long (usually 2-5 short paragraphs). Use bullet points when listing.
- For Science questions, give the actual concept first, then a simple analogy or example.
- If the student asks for problem-solving, show the steps clearly.
- Encouraging tone but never dishonest — if the student is wrong, gently correct them.`;
}

// 탭(주제) 클릭
document.querySelectorAll('.topic-chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.topic-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTopic = btn.dataset.topic;
  });
});

// 입력 영역 자동 높이
const input = document.getElementById('msg-input');
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function renderHistory() {
  const area = document.getElementById('chat-area');
  const empty = document.getElementById('empty-state');
  const clearRow = document.getElementById('clear-row');
  if (history.length === 0) {
    empty.style.display = '';
    clearRow.style.display = 'none';
    area.querySelectorAll('.msg').forEach(m => m.remove());
    return;
  }
  empty.style.display = 'none';
  clearRow.style.display = '';
  area.querySelectorAll('.msg').forEach(m => m.remove());
  for (const m of history) {
    const div = document.createElement('div');
    div.className = 'msg ' + m.role;
    if (m.role === 'assistant') {
      div.innerHTML = `<div class="amy-md">${renderMarkdown(m.content)}</div>`;
    } else {
      div.textContent = m.content;
    }
    area.insertBefore(div, clearRow.parentNode === area ? clearRow : null);
    area.appendChild(div);
  }
  area.scrollTop = area.scrollHeight;
}

function saveHistory() {
  // 너무 길어지면 자르기
  while (history.length > 40) history.shift();
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function clearChat() {
  if (!confirm('대화 기록을 지울까요?')) return;
  history = [];
  saveHistory();
  renderHistory();
}

function askSuggested(q) {
  input.value = q;
  input.dispatchEvent(new Event('input'));
  sendMessage();
}

async function sendMessage() {
  if (sending) return;
  const txt = input.value.trim();
  if (!txt) return;

  sending = true;
  document.getElementById('send-btn').disabled = true;

  history.push({ role: 'user', content: txt });
  saveHistory();
  input.value = '';
  input.style.height = 'auto';
  renderHistory();

  // 타이핑 표시
  const area = document.getElementById('chat-area');
  const typing = document.createElement('div');
  typing.className = 'msg assistant';
  typing.id = 'typing-indicator';
  typing.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  area.appendChild(typing);
  area.scrollTop = area.scrollHeight;

  try {
    const response = await callClaude({
      system: buildSystem(),
      messages: history.map(m => ({ role: m.role, content: m.content })),
      maxTokens: 2048,
      temperature: 0.6,
    });
    const reply = extractText(response);
    history.push({ role: 'assistant', content: reply });
    saveHistory();
    typing.remove();
    renderHistory();
  } catch (e) {
    typing.remove();
    const err = document.createElement('div');
    err.className = 'msg error';
    err.textContent = '❌ 오류: ' + e.message;
    area.appendChild(err);
    area.scrollTop = area.scrollHeight;
    // 마지막 사용자 메시지 제거 (다시 시도할 수 있게)
    history.pop();
    saveHistory();
  } finally {
    sending = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }
}

renderHistory();
input.focus();
</script>
</body>
</html>
