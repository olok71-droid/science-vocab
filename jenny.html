<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💛 Jenny 영어공부</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fffbf2;
    --card: #ffffff;
    --accent: #f6a623;
    --accent2: #ffcc5c;
    --green: #3ecfb2;
    --red: #ff7a7a;
    --purple: #a78bfa;
    --blue: #60c4f8;
    --text: #4a3a1f;
    --muted: #c2a878;
    --shadow: rgba(246,166,35,0.14);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito','Noto Sans KR',sans-serif;
    min-height: 100vh;
    padding: 0 0 60px;
    background-image: radial-gradient(circle at 15% 12%, rgba(246,166,35,0.13) 0%, transparent 50%),
                      radial-gradient(circle at 85% 85%, rgba(255,204,92,0.13) 0%, transparent 50%);
  }
  header { text-align:center; padding: 48px 20px 16px; }
  .back {
    position: absolute; left: 14px; top: 18px;
    text-decoration:none; color: var(--accent); font-weight:800; font-size:14px;
    background:#fff; padding:6px 12px; border-radius:20px;
    box-shadow:0 2px 10px var(--shadow);
  }
  header h1 { font-size:26px; font-weight:900; margin-bottom:4px; letter-spacing:-0.5px; }
  header h1 .heart { font-size:20px; }
  header h1 .y { color: var(--accent); }
  header .tagline { font-size:13px; color:var(--muted); font-weight:700; }

  .container { max-width: 720px; margin: 0 auto; padding: 0 14px; }

  /* 탭 */
  .tabs {
    display:flex; gap:6px; background:#fff; padding:6px; border-radius:16px;
    box-shadow:0 2px 12px var(--shadow); margin-bottom:16px; position:sticky; top:8px; z-index:20;
  }
  .tab-btn {
    flex:1; border:none; background:transparent; padding:10px 4px; border-radius:11px;
    font-family:inherit; font-weight:800; font-size:14px; color:var(--muted); cursor:pointer;
    transition:all .18s;
  }
  .tab-btn.active { background:var(--accent); color:#fff; box-shadow:0 3px 10px var(--shadow); }

  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  /* Day 필터 */
  .day-filter { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .day-chip {
    border:none; background:#fff; color:var(--accent); font-family:inherit;
    font-weight:800; font-size:13px; padding:7px 13px; border-radius:20px; cursor:pointer;
    box-shadow:0 2px 8px var(--shadow); border:2px solid transparent; transition:all .15s;
  }
  .day-chip.active { background:var(--accent); color:#fff; }
  .month-chip { background:rgba(246,166,35,0.13); }
  .month-chip.active { background:var(--accent); color:#fff; }
  .month-head {
    font-size:18px; font-weight:900; color:var(--text); margin:22px 2px 4px;
    padding-bottom:6px; border-bottom:2px dashed rgba(246,166,35,0.4);
  }

  .search {
    width:100%; border:2px solid rgba(246,166,35,0.2); border-radius:14px;
    padding:11px 14px; font-family:inherit; font-size:15px; color:var(--text);
    margin-bottom:14px; background:#fff; outline:none;
  }
  .search:focus { border-color:var(--accent); }

  /* Day 섹션 */
  .day-head {
    font-size:15px; font-weight:900; color:var(--accent); margin:18px 2px 10px;
    display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap;
  }
  .day-head .cnt { font-size:12px; color:var(--muted); font-weight:700; }
  .dh-btns { display:flex; gap:5px; }

  /* 블라인드 버튼 (Day 줄 오른쪽) */
  .blind-btn {
    border:1.5px solid rgba(246,166,35,0.3); background:#fff; color:var(--muted);
    font-family:inherit; font-weight:800; font-size:11px; padding:5px 9px; border-radius:14px;
    cursor:pointer; transition:all .15s; white-space:nowrap;
  }
  .blind-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .play-all-btn { color:var(--green); border-color:rgba(62,207,178,0.45); }
  .play-all-btn.active { background:var(--red); color:#fff; border-color:var(--red); }

  /* 단어 줄 (좌 영어 | 우 한글) */
  .wrow {
    display:flex; align-items:center; gap:8px;
    background:var(--card); border-radius:13px; padding:11px 12px; margin-bottom:7px;
    box-shadow:0 1px 6px var(--shadow); border:1.5px solid rgba(246,166,35,0.1);
  }
  .wrow.hidden { display:none; }
  .w-en { flex:1.05; font-size:16px; font-weight:800; color:var(--text); line-height:1.25; min-width:0; }
  .w-ko { flex:1; font-size:14px; color:var(--accent); font-weight:700; line-height:1.25; min-width:0; }
  .spk {
    border:none; background:rgba(246,166,35,0.12); color:var(--accent);
    width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer; flex-shrink:0;
    transition:all .15s;
  }
  .spk:hover { background:var(--accent); color:#fff; }
  .spk.sm { width:28px; height:28px; font-size:13px; }

  /* 외움 체크 */
  .btn-mem { border:1.5px solid rgba(148,163,184,0.45); background:transparent; width:34px; height:34px;
    border-radius:50%; font-size:16px; cursor:pointer; flex-shrink:0; line-height:1; padding:0; transition:all .15s; }
  .btn-mem.on { background:rgba(34,197,94,0.18); border-color:#22c55e; }
  .wrow.memorized { opacity:.5; }
  .wrow.memorized .w-en > span { text-decoration:line-through; }
  .mem-bar { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; font-size:12px; }
  .mem-info { color:var(--muted); font-weight:800; }
  .mem-info b { color:#22c55e; }
  .mem-toggle-btn { border:1.5px solid rgba(246,166,35,0.4); background:transparent; color:var(--muted);
    font-family:inherit; font-weight:800; font-size:11px; padding:4px 10px; border-radius:13px; cursor:pointer; white-space:nowrap; }
  .mem-toggle-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  /* 블라인드(가림) — 글자 숨기고 톡 누르면 잠깐 보임 */
  .cell { position:relative; cursor:default; }
  .cell.blinded { cursor:pointer; }
  .cell.blinded > span { filter:blur(6px); opacity:0.45; user-select:none; }
  .cell.blinded::after {
    content:'👀'; position:absolute; right:2px; top:50%; transform:translateY(-50%);
    font-size:12px; opacity:0.5;
  }
  .cell.blinded.peek > span { filter:none; opacity:1; }
  .cell.blinded.peek::after { content:''; }

  /* 예문 줄 (항상 보임) */
  .ex-row {
    display:flex; align-items:center; gap:8px;
    margin:-3px 0 9px 8px; padding:9px 12px;
    background:rgba(246,166,35,0.06); border-radius:11px;
    border-left:3px solid rgba(246,166,35,0.4);
  }
  .ex-en { flex:1.05; font-size:13.5px; color:#6a5a3a; font-style:italic; line-height:1.35; min-width:0; }
  .ex-ko { flex:1; font-size:12.5px; color:var(--muted); font-weight:600; line-height:1.35; min-width:0; }

  /* 문장 탭 (한글 위 / 영어 아래) */
  .phrase-bar { display:flex; justify-content:flex-end; margin-bottom:12px; }
  /* 주제 목록 */
  .topic-intro { font-size:14px; font-weight:800; color:var(--muted); margin:4px 2px 12px; }
  .topic-grid { display:flex; flex-direction:column; gap:10px; }
  .topic-card {
    display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%;
    background:var(--card); border:1.5px solid rgba(246,166,35,0.18); border-radius:16px;
    padding:16px 18px; cursor:pointer; font-family:inherit; box-shadow:0 2px 10px var(--shadow);
    transition:all .15s; text-align:left;
  }
  .topic-card:hover { transform:translateY(-2px); border-color:var(--accent); }
  .tc-title { font-size:16px; font-weight:900; color:var(--text); }
  .tc-cnt { font-size:13px; font-weight:800; color:var(--accent); white-space:nowrap; }
  .topic-back {
    border:none; background:#fff; color:var(--accent); font-family:inherit; font-weight:800;
    font-size:13px; padding:7px 14px; border-radius:20px; cursor:pointer;
    box-shadow:0 2px 8px var(--shadow); margin-bottom:14px;
  }
  .pset { margin-bottom:26px; }
  .pset-title {
    font-size:16px; font-weight:900; color:var(--accent); margin:4px 2px 10px;
    display:flex; align-items:center; gap:6px;
  }
  .concept {
    background:linear-gradient(135deg, rgba(167,139,250,0.13), rgba(96,196,248,0.10));
    border:1.5px solid rgba(167,139,250,0.25); border-left:4px solid var(--purple);
    border-radius:14px; padding:13px 15px; margin-bottom:16px;
    font-size:13.5px; line-height:1.65; color:#5a4a7a; font-weight:600;
  }
  .concept .ctitle { display:block; font-size:14px; font-weight:900; color:var(--purple); margin-bottom:6px; }
  .concept b { color:var(--purple); font-weight:800; }
  .concept code {
    background:#fff; border-radius:6px; padding:1px 6px; font-family:'Courier New',monospace;
    font-weight:800; color:var(--purple); font-size:12.5px;
  }
  .p-item {
    background:var(--card); border-radius:14px; padding:13px 14px; margin-bottom:9px;
    box-shadow:0 1px 6px var(--shadow); border:1.5px solid rgba(246,166,35,0.1);
  }
  .p-ko { font-size:15.5px; font-weight:800; color:var(--text); line-height:1.4; margin-bottom:9px; }
  .p-en-row { display:flex; align-items:center; gap:8px; }
  .p-en {
    flex:1; min-width:0; font-size:15px; font-weight:700; color:#1ba88a; line-height:1.4;
    background:rgba(62,207,178,0.10); border-radius:10px; padding:9px 12px;
  }
  .p-en.blinded > span { filter:blur(6.5px); opacity:0.4; user-select:none; }

  /* 테스트 */
  .test-setup { text-align:center; padding:10px 0 4px; }
  .test-setup p { color:var(--muted); font-weight:700; font-size:14px; margin-bottom:14px; }
  .big-btn {
    border:none; background:var(--accent); color:#fff; font-family:inherit; font-weight:800;
    font-size:16px; padding:13px 30px; border-radius:14px; cursor:pointer;
    box-shadow:0 4px 14px var(--shadow); transition:all .15s;
  }
  .big-btn:hover { transform:translateY(-2px); }
  .big-btn.alt { background:#fff; color:var(--accent); border:2px solid rgba(246,166,35,0.3); }

  .test-stats {
    display:flex; justify-content:center; gap:18px; margin-bottom:16px; font-weight:800; font-size:14px;
  }
  .test-stats .ok { color:var(--green); }
  .test-stats .no { color:var(--red); }
  .test-stats .rem { color:var(--muted); }

  .q-card {
    background:#fff; border-radius:18px; padding:22px 18px; box-shadow:0 4px 16px var(--shadow);
    border:2px solid rgba(246,166,35,0.12); text-align:center; margin-bottom:14px;
  }
  .q-day { font-size:12px; font-weight:800; color:var(--muted); margin-bottom:8px; }
  .q-ko { font-size:24px; font-weight:900; color:var(--text); margin-bottom:6px; line-height:1.3; }
  .q-sub { font-size:13px; color:var(--muted); font-weight:700; }

  /* 타이핑 시험 */
  .sp-hint {
    font-family:'Courier New',monospace; letter-spacing:2px; font-size:18px;
    color:var(--muted); font-weight:800; margin:12px 0 14px; line-height:1.5;
  }
  .sp-input {
    width:100%; border:2px solid rgba(246,166,35,0.3); border-radius:13px;
    padding:14px; font-family:inherit; font-size:18px; text-align:center;
    color:var(--text); background:#fff; outline:none; transition:all .12s;
  }
  .sp-input:focus { border-color:var(--accent); }
  .sp-input.ok { border-color:var(--green); background:rgba(62,207,178,0.08); }
  .sp-input.no { border-color:var(--red); background:rgba(255,122,122,0.08); }
  .sp-input:disabled { opacity:1; }
  .sp-feedback { min-height:26px; margin:12px 0; font-weight:800; font-size:16px; line-height:1.4; }
  .sp-feedback .good { color:var(--green); }
  .sp-feedback .bad  { color:var(--red); }
  .sp-feedback .ans  { color:var(--accent); font-size:19px; }
  .sp-feedback .ans-ko { color:var(--muted); font-size:13px; font-weight:700; }
  .sp-actions { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .next-row { text-align:center; margin-top:6px; }

  footer { text-align:center; padding:24px; color:var(--muted); font-size:11px; }
  footer span { color:var(--accent); }

  /* 📷 새 자료 올리기 (우하단 떠있는 버튼) */
  .upload-fab {
    position:fixed; right:16px; bottom:16px; z-index:50;
    width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
    background:var(--accent); color:#fff; font-size:24px;
    box-shadow:0 4px 16px rgba(246,166,35,0.45);
    display:flex; align-items:center; justify-content:center;
  }
  .upload-fab:active { transform:scale(0.94); }
  .upload-overlay {
    position:fixed; inset:0; z-index:60; display:none;
    background:rgba(74,58,31,0.45);
    align-items:center; justify-content:center; padding:24px;
  }
  .upload-overlay.show { display:flex; }
  .upload-box {
    background:#fff; border-radius:20px; padding:28px 24px; max-width:340px; width:100%;
    text-align:center; box-shadow:0 8px 30px rgba(0,0,0,0.18);
  }
  .upload-box .big-emoji { font-size:40px; margin-bottom:10px; }
  .upload-box h3 { font-size:18px; font-weight:900; margin-bottom:8px; color:var(--text); }
  .upload-box p { font-size:14px; color:var(--muted); font-weight:700; line-height:1.5; margin-bottom:6px; }
  .upload-box .upload-status { min-height:22px; font-size:14px; font-weight:800; color:var(--accent); }
  .upload-box .upload-close {
    margin-top:14px; border:none; cursor:pointer; border-radius:14px;
    background:var(--accent); color:#fff; font-family:inherit;
    font-weight:800; font-size:15px; padding:10px 26px;
  }
</style>
</head>
<body>

<a class="back" href="index.html">← 메인</a>
<header>
  <h1><span class="heart">💛</span> <span class="y">Jenny</span> 영어공부</h1>
  <p class="tagline">phrase - May · Day 1–7 · 듣고 따라 말해요 🎧</p>
</header>

<div class="container">

  <div class="tabs">
    <button class="tab-btn active" data-tab="vocab">📖 단어장</button>
    <button class="tab-btn" data-tab="phrase">📝 문장</button>
    <button class="tab-btn" data-tab="test">✅ 테스트</button>
  </div>

  <!-- 단어장 -->
  <div class="tab-panel active" id="tab-vocab">
    <input class="search" id="search" placeholder="🔍 영어 또는 한글 검색…">
    <div class="mem-bar">
      <span class="mem-info">✅ 외움 <b id="mem-count">0</b>개</span>
      <button class="mem-toggle-btn" id="mem-hide-btn" onclick="toggleHideMem()">외운 단어 숨기기</button>
      <button class="mem-toggle-btn" onclick="resetMem()">↺ 외움 초기화</button>
    </div>
    <div class="day-filter" id="month-filter"></div>
    <div class="day-filter" id="day-filter"></div>
    <div id="vocab-list"></div>
  </div>

  <!-- 문장 (한글 보고 영어 말하기) -->
  <div class="tab-panel" id="tab-phrase">
    <div id="phrase-list"></div>
  </div>

  <!-- 테스트 -->
  <div class="tab-panel" id="tab-test">
    <div class="day-filter" id="test-month-filter"></div>
    <div class="day-filter" id="test-day-filter"></div>
    <div class="test-setup" id="test-setup">
      <p>한글 뜻을 보고 🗣️ 입으로 말한 다음,<br>영어로 직접 타이핑해서 확인해요.<br>위에서 월·Day를 고르면 그 범위만 시험봐요.</p>
      <button class="big-btn" onclick="startTest()">▶︎ 테스트 시작</button>
    </div>
    <div id="test-area" style="display:none;">
      <div class="test-stats">
        <span class="ok">⭕ <span id="t-ok">0</span></span>
        <span class="no">❌ <span id="t-no">0</span></span>
        <span class="rem">남음 <span id="t-rem">0</span></span>
      </div>
      <div class="q-card">
        <div class="q-day" id="t-day">Day 1</div>
        <div class="q-ko" id="t-ko"></div>
        <div class="sp-hint" id="t-hint"></div>
        <input class="sp-input" id="t-input" type="text" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false" placeholder="영어로 입력…">
        <div class="sp-feedback" id="t-fb"></div>
        <div class="sp-actions" id="t-actions"></div>
      </div>
    </div>
  </div>

</div>

<footer>💛 <span>Jenny 영어공부</span> · phrase - May</footer>

<!-- 📷 새 학습자료(사진) 올리기 -->
<button class="upload-fab" onclick="document.getElementById('upload-input').click()" title="새 학습자료 사진 올리기">📷</button>
<input type="file" id="upload-input" accept="image/*" multiple style="display:none" onchange="uploadPhotos(this.files)">
<div class="upload-overlay" id="upload-overlay">
  <div class="upload-box">
    <div class="big-emoji" id="upload-emoji">📤</div>
    <h3 id="upload-title">사진 보내는 중…</h3>
    <p id="upload-desc">잠시만 기다려 주세요.</p>
    <div class="upload-status" id="upload-status"></div>
    <button class="upload-close" id="upload-close" style="display:none" onclick="closeUpload()">확인</button>
  </div>
</div>

<script>
// ─── 데이터 (phrase - May) ───
const DATA = [
  // Day 1
  {d:1, en:"Practical", ko:"실용적인, 현실적인", ex:"This bag is very practical.", exko:"이 가방은 아주 실용적이야."},
  {d:1, en:"Handy", ko:"편리한, 유용한", ex:"This little tool is really handy.", exko:"이 작은 도구 정말 편리해."},
  {d:1, en:"Come in handy", ko:"유용하게 쓰이다", ex:"This umbrella will come in handy.", exko:"이 우산 유용하게 쓰일 거야."},
  {d:1, en:"License plate", ko:"자동차 번호판", ex:"I couldn't read the license plate.", exko:"번호판을 못 읽었어."},
  {d:1, en:"Cram", ko:"벼락치기로 공부하다", ex:"I had to cram all night.", exko:"밤새 벼락치기 해야 했어."},
  {d:1, en:"Cram for the test", ko:"시험 벼락치기를 하다", ex:"She is cramming for the test.", exko:"걔는 시험 벼락치기 중이야."},
  {d:1, en:"Extend", ko:"연장하다, 늘리다", ex:"Can I extend the deadline?", exko:"마감을 연장할 수 있을까요?"},
  {d:1, en:"Resist", ko:"저항하다, 참다", ex:"I can't resist chocolate.", exko:"초콜릿은 못 참겠어."},
  {d:1, en:"Temptation / tempting", ko:"유혹 / 유혹적인", ex:"The cake looks so tempting.", exko:"그 케이크 너무 먹음직스러워."},
  {d:1, en:"In the first place", ko:"애초에", ex:"Why did you come here in the first place?", exko:"애초에 여긴 왜 온 거야?"},
  {d:1, en:"Blurry", ko:"흐릿한, 뿌연", ex:"The photo is a bit blurry.", exko:"사진이 좀 흐릿해."},

  // Day 2
  {d:2, en:"Rely on / reliable", ko:"~에 의존하다 / 믿을 만한", ex:"You can rely on me. He is reliable.", exko:"날 믿어도 돼. 그는 믿을 만해."},
  {d:2, en:"Relatively", ko:"상대적으로, 비교적", ex:"It's relatively cheap.", exko:"그건 비교적 싸."},

// ─── 발음 ───
// 미리 받아둔 음성 파일(audio/jenny/)을 우리 사이트 안에서 직접 재생 → 어디서나 확실히 됨.
// (단어=w번호.mp3, 예문=e번호.mp3) 파일을 못 틀면 폰 내장 음성으로 보조.
function cleanText(t){ return t.replace(/~/g,'').replace(/\s*\/\s*/g,', ').trim(); }
let _audio = null;
function playClip(kind, id) {
  const w = DATA[id];
  const fb = () => { if (w) fallbackSpeak(cleanText(kind === 'e' ? w.ex : w.en)); };
  try {
    if (_audio) { _audio.pause(); _audio = null; }
    const a = new Audio('audio/jenny/' + kind + id + '.mp3');
    a.onerror = fb;
    _audio = a;
    const p = a.play();
    if (p && p.catch) p.catch(fb);
  } catch (e) {
    fb();
  }
}
// 보조: 폰 내장 음성 (인터넷 안 될 때 등)
let _voices = [];
function loadVoices(){ if (window.speechSynthesis) _voices = window.speechSynthesis.getVoices() || []; }
if (window.speechSynthesis) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }
function normLang(l){ return (l || '').replace(/_/g,'-').toLowerCase(); }
function fallbackSpeak(text){
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.9;
  const en = _voices.filter(v => normLang(v.lang).startsWith('en'));
  const local = en.filter(v => v.localService);
  const pool = local.length ? local : en;
  const v = pool.find(x => normLang(x.lang)==='en-gb') || pool.find(x => normLang(x.lang)==='en-us') || pool[0];
  if (v) { u.voice = v; u.lang = normLang(v.lang); } else { u.lang = 'en-GB'; }
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
  setTimeout(() => { try { window.speechSynthesis.resume(); } catch(e){} }, 80);
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let blindEn = false, blindKo = false;   // 각각 켜기/끄기 토글

// 가려진 칸 톡 누르면 잠깐 보임
function peek(el) {
  if (el.classList.contains('blinded')) el.classList.toggle('peek');
}

function cell(side, text) {
  const isBlind = (side === 'en') ? blindEn : blindKo;
  return `<div class="w-${side} cell${isBlind ? ' blinded' : ''}" onclick="peek(this)"><span>${esc(text)}</span></div>`;
}

function blindButtons(m, day) {

    <button class="blind-btn${blindEn ? ' active' : ''}" onclick="toggleBlind('en')">🇬🇧 영어가림</button>
    <button class="blind-btn${blindKo ? ' active' : ''}" onclick="toggleBlind('ko')">🇰🇷 한글가림</button>

}

// ─── Day 단어 쭉 듣기 (한국어 뜻 → 영어 순서) ───
let _seq = null;   // 재생 중인 시퀀스 {token, btn}

function stopSeq() {
  if (_seq) _seq.token = -1;            // 진행 중 콜백 무효화
  if (_audio) { _audio.pause(); _audio = null; }
  _seq = null;
  document.querySelectorAll('.play-all-btn').forEach(b => {
    b.classList.remove('active'); b.textContent = '▶ 듣기';
  });
}

function playFile(src, token, done) {
  if (!_seq || _seq.token !== token) return;
  try {
    if (_audio) { _audio.pause(); _audio = null; }
    const a = new Audio(src);
    _audio = a;
    a.onended = () => { if (_seq && _seq.token === token) done(); };
    a.onerror = () => { if (_seq && _seq.token === token) done(); };  // 파일 없으면 건너뜀
    const p = a.play();
    if (p && p.catch) p.catch(() => { if (_seq && _seq.token === token) done(); });
  } catch (e) { if (_seq && _seq.token === token) done(); }
}

let _seqToken = 0;
function playDay(m, day, btn) {
  const wasPlaying = btn.classList.contains('active');
  stopSeq();
  if (wasPlaying) return;              // 이미 재생 중이던 버튼 → 멈춤
  const q = query.toLowerCase().trim();
  const items = DATA.filter(w => w.m === m && w.d === day && (
    !q || w.en.toLowerCase().includes(q) || w.ko.toLowerCase().includes(q) || w.ex.toLowerCase().includes(q)
  ) && !memSet.has(w.id));   // 외운 단어는 빼고 재생
  if (!items.length) return;
  btn.classList.add('active'); btn.textContent = '⏹ 멈춤';
  const token = ++_seqToken;
  _seq = { token, btn };
  let idx = 0;
  const playOne = () => {
    if (!_seq || _seq.token !== token) return;
    if (idx >= items.length) { stopSeq(); return; }
    const w = items[idx];
    playFile('audio/jenny/k' + w.id + '.mp3', token, () => {   // ① 한국어 뜻
      playFile('audio/jenny/w' + w.id + '.mp3', token, () => {  // ② 영어 단어
        idx++;
        setTimeout(playOne, 350);                               // 단어 사이 살짝 쉼
      });
    });
  };
  playOne();
}

function renderVocab() {
  stopSeq();   // 목록 다시 그릴 땐 재생 멈춤
  const wrap = document.getElementById('vocab-list');
  const q = query.toLowerCase().trim();
  let html = '';
  MONTHS.forEach(mo => {
    if (vocabMonth !== 'all' && vocabMonth !== mo.m) return;
    let monthHasContent = false;
    let monthHtml = '';
    DAYS.forEach(day => {
      if (vocabDay !== 'all' && vocabDay !== day) return;
      const items = DATA.filter(w => w.m === mo.m && w.d === day && (
        !q || w.en.toLowerCase().includes(q) || w.ko.toLowerCase().includes(q) || w.ex.toLowerCase().includes(q)
      ) && !(memHidden && memSet.has(w.id)));
      if (items.length === 0) return;
      monthHasContent = true;
      monthHtml += `<div class="day-head"><span class="dh-title">📅 Day ${day} <span class="cnt">· ${items.length}개</span></span>${blindButtons(mo.m, day)}</div>`;
      items.forEach(w => {
        const mem = memSet.has(w.id);
        monthHtml += `<div class="wrow${mem ? ' memorized' : ''}">
          ${cell('en', w.en)}
          ${cell('ko', w.ko)}
          <button class="spk" onclick="playClip('w', ${w.id})" aria-label="단어 발음">🔊</button>
          <button class="btn-mem${mem ? ' on' : ''}" onclick="toggleMem(${w.id})" title="외웠으면 체크 (전체듣기에서 빠짐)">${mem ? '✅' : '🧠'}</button>
        </div>
        <div class="ex-row">
          <div class="ex-en cell${blindEn ? ' blinded' : ''}" onclick="peek(this)"><span>${esc(w.ex)}</span></div>
          <div class="ex-ko cell${blindKo ? ' blinded' : ''}" onclick="peek(this)"><span>${esc(w.exko || '')}</span></div>
          <button class="spk sm" onclick="playClip('e', ${w.id})" aria-label="예문 발음">🔊</button>
        </div>`;
      });
    });
    if (monthHasContent) {
      html += `<div class="month-head">🗓️ ${mo.label}</div>` + monthHtml;
    }
  });
  if (!html) html = `<p style="text-align:center;color:var(--muted);font-weight:700;padding:30px 0;">검색 결과가 없어요 🐣</p>`;
  wrap.innerHTML = html;
  const mc = document.getElementById('mem-count');
  if (mc) mc.textContent = memSet.size;
}

    if (_audio) { _audio.pause(); _audio = null; }
    const a = new Audio('audio/jenny_phrase/p' + si + '_' + i + '.mp3');
    a.onerror = fb;
    _audio = a;
    const p = a.play();
    if (p && p.catch) p.catch(fb);
  } catch (e) { fb(); }
}

function togglePhraseBlind(){ phraseBlind = !phraseBlind; renderPhrases(); }

function playPhraseAll(si, btn) {
  const wasPlaying = btn.classList.contains('active');
  stopSeq();
  if (wasPlaying) return;
  const items = PHRASE_SETS[si].items;
  if (!items.length) return;
  btn.classList.add('active'); btn.textContent = '⏹ 멈춤';
  const token = ++_seqToken;
  _seq = { token, btn };
  let idx = 0;
  const playOne = () => {
    if (!_seq || _seq.token !== token) return;
    if (idx >= items.length) { stopSeq(); return; }
    const next = () => { idx++; setTimeout(playOne, 350); };
    playFile('audio/jenny_phrase/p' + si + '_' + idx + '.mp3', token, next);
  };
  playOne();
}

function openTopic(i){ currentTopic = i; renderPhrases(); window.scrollTo({top:0, behavior:'smooth'}); }
function closeTopic(){ stopSeq(); currentTopic = null; renderPhrases(); window.scrollTo({top:0, behavior:'smooth'}); }

function renderPhrases(){
  const wrap = document.getElementById('phrase-list');

  // 주제 목록 화면
  if (currentTopic === null) {
    let html = `<div class="topic-intro">📚 공부할 주제를 골라요</div><div class="topic-grid">`;

    </div>
    <div class="pset">
      <div class="pset-title">📝 ${esc(set.title)}</div>

  set.items.forEach((p, i) => {

        <button class="spk sm" onclick="speakPhrase(${si}, ${i})" aria-label="문장 발음">🔊</button>

  });

renderPhrases();

// ─── 테스트 (타이핑) ───
let testMonth = 'all';
let testDay = 'all';
const test = { pool:[], cur:null, ok:0, no:0, answered:false };

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

// 채점용 정규화: 소문자, ~ 제거, 영숫자/공백만, 공백 정리
function norm(s){
  return s.toLowerCase().replace(/~/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
// 정답 후보들 (슬래시로 나뉜 것, 괄호 안 빼고/넣고 모두 인정)
function acceptedAnswers(en){
  const set = new Set();
  const add = s => { const n = norm(s); if (n) set.add(n); };
  en.split('/').forEach(part => { add(part); add(part.replace(/\(.*?\)/g,'')); });
  add(en); add(en.replace(/\(.*?\)/g,''));
  return set;
}
// 글자수 힌트: 각 단어 첫 글자만 보여주고 나머지는 _
function makeHint(s){
  return s.split(' ').map(word => {
    if (!/[A-Za-z]/.test(word)) return word;     // ~ , / 등은 그대로
    let shown = false, out = '';
    for (const ch of word){
      if (/[A-Za-z]/.test(ch)){ out += shown ? '_' : ch; shown = true; }
      else out += ch;
    }
    return out;
  }).join(' ');
}

function startTest() {
  const subset = DATA.filter(w => (testMonth === 'all' || w.m === testMonth) && (testDay === 'all' || w.d === testDay));
  test.pool = shuffle(subset);
  test.ok = 0; test.no = 0;
  document.getElementById('test-setup').style.display = 'none';
  document.getElementById('test-area').style.display = 'block';
  updateStats();
  nextQ();
}

function nextQ() {
  if (test.pool.length === 0) { finishTest(); return; }
  test.cur = test.pool.shift();
  test.answered = false;
  const w = test.cur;
  document.getElementById('t-day').textContent = (w.m === 6 ? '6월 ' : '5월 ') + 'Day ' + w.d;
  document.getElementById('t-ko').textContent = w.ko;
  document.getElementById('t-hint').textContent = makeHint(w.en);
  document.getElementById('t-fb').innerHTML = '';
  const input = document.getElementById('t-input');
  input.value = ''; input.disabled = false;
  input.className = 'sp-input';
  input.placeholder = '영어로 입력…';
  document.getElementById('t-actions').innerHTML =
    `<button class="big-btn" onclick="checkAnswer()">확인 ✓</button>
     <button class="big-btn alt" onclick="revealAnswer()">모르겠어요 👀</button>`;
  updateStats();
  setTimeout(() => input.focus(), 80);
}

function checkAnswer() {
  if (test.answered) return;
  const w = test.cur;
  const input = document.getElementById('t-input');
  const userVal = norm(input.value);
  if (!userVal) { input.focus(); return; }
  const correct = acceptedAnswers(w.en).has(userVal);
  test.answered = true;
  input.disabled = true;
  if (correct) {
    test.ok++;
    input.classList.add('ok');
    document.getElementById('t-fb').innerHTML = '<span class="good">정답이에요! 🎉</span>';
  } else {
    test.no++;
    input.classList.add('no');
    document.getElementById('t-fb').innerHTML =
      '<span class="bad">아쉬워요! 정답 👉</span><br>' +
      '<span class="ans">' + esc(w.en) + '</span><br>' +
      '<span class="ans-ko">' + esc(w.ko) + '</span>';
  }
  playClip('w', w.id);
  document.getElementById('t-actions').innerHTML =
    `<button class="big-btn" onclick="playClip('w', ${w.id})">🔊 다시 듣기</button>
     <button class="big-btn" onclick="nextQ()">다음 ▶︎</button>`;
  updateStats();
}

function revealAnswer() {
  if (test.answered) return;
  const w = test.cur;
  const input = document.getElementById('t-input');
  test.answered = true;
  test.no++;
  input.value = w.en; input.disabled = true; input.classList.add('no');
  document.getElementById('t-fb').innerHTML =
    '<span class="ans">' + esc(w.en) + '</span><br>' +
    '<span class="ans-ko">' + esc(w.ko) + '</span>';
  playClip('w', w.id);
  document.getElementById('t-actions').innerHTML =
    `<button class="big-btn" onclick="playClip('w', ${w.id})">🔊 다시 듣기</button>
     <button class="big-btn" onclick="nextQ()">다음 ▶︎</button>`;
  updateStats();
}

function finishTest() {
  const total = test.ok + test.no;
  document.getElementById('t-day').textContent = '';
  document.getElementById('t-ko').textContent = '🎉 끝!';
  document.getElementById('t-hint').textContent = '';
  document.getElementById('t-input').style.display = 'none';
  document.getElementById('t-fb').innerHTML =
    '<span class="good" style="font-size:18px;">맞은 개수 ' + test.ok + ' / ' + total + '</span>';
  document.getElementById('t-actions').innerHTML =
    `<button class="big-btn" onclick="resetTest()">다시 시작 🔁</button>`;
}

function resetTest() {
  document.getElementById('t-input').style.display = '';
  document.getElementById('test-area').style.display = 'none';
  document.getElementById('test-setup').style.display = 'block';
}

// 엔터로 확인/다음
document.getElementById('t-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); if (!test.answered) checkAnswer(); }
});

function updateStats() {
  document.getElementById('t-ok').textContent = test.ok;
  document.getElementById('t-no').textContent = test.no;
  const remaining = test.pool.length + (test.cur && !test.answered ? 1 : 0);
  document.getElementById('t-rem').textContent = remaining;
}

// 큰 사진은 가로세로 최대 2000px JPEG로 줄여서 전송 (8MB 제한 대비)
function shrinkImage(file) {
  return new Promise(resolve => {
    if (file.size < 3 * 1024 * 1024) { resolve(file); return; } // 3MB 미만은 그대로
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 2000;
      let w = img.naturalWidth, h = img.naturalHeight;
      if (w > max || h > max) { const r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => resolve(b || file), 'image/jpeg', 0.88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

async function uploadPhotos(files) {
  if (!files || !files.length) return;
  const list = Array.from(files);
  showUpload('📤', '사진 보내는 중…', '잠시만 기다려 주세요.', '0 / ' + list.length);
  let sent = 0, failed = 0;
  for (const f of list) {
    try {
      const blob = await shrinkImage(f);
      const res = await fetch(UPLOAD_URL + '?name=' + encodeURIComponent(f.name || 'photo.jpg'), {
        method: 'POST',
        headers: { 'X-Key': UPLOAD_KEY, 'Content-Type': blob.type || 'image/jpeg' },
        body: blob,
      });
      const j = await res.json();
      if (j.ok) sent++; else failed++;
    } catch (e) { failed++; }
    document.getElementById('upload-status').textContent = (sent + failed) + ' / ' + list.length;
  }
  if (failed === 0) {
    showUpload('✅', '다 보냈어요!', '맥 컴퓨터가 곧 사진을 읽고 새 학습 내용을 자동으로 만들어요. 보통 몇 분 걸려요. 끝나면 앱을 새로고침하면 보여요.', sent + '장 전송 완료', true);
  } else {
    showUpload('⚠️', '일부 실패', '성공 ' + sent + '장, 실패 ' + failed + '장. 인터넷 연결을 확인하고 실패한 사진만 다시 올려 주세요.', '', true);
  }
}
