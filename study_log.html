<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공부기록 · AMY Study App</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fafaf9; --card:#ffffff; --text:#111; --muted:#6f6f6f; --line:#e7e5e4; --soft:#f5f5f4; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Nunito','Noto Sans KR',sans-serif; font-size:15px; }
  .wrap { max-width:820px; margin:0 auto; padding:16px; }
  .top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .top h1 { font-size:20px; font-weight:900; margin:0; flex:1; }
  a.back { color:var(--text); font-weight:800; text-decoration:none; border:1px solid var(--line); border-radius:10px; padding:6px 12px; background:var(--card); }
  .bar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  button, select, input[type=date] { font-family:inherit; font-size:14px; font-weight:800; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:10px; padding:7px 12px; cursor:pointer; }
  button.on { background:#111; color:#fff; border-color:#111; }
  .tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px; }
  .tabs button { white-space:nowrap; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .card h2 { font-size:16px; margin:0 0 8px; font-weight:900; }
  .card h3 { font-size:14px; margin:12px 0 6px; font-weight:900; }
  .muted { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12.5px; color:var(--muted); font-weight:800; }
  td.num, th.num { text-align:right; white-space:nowrap; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:var(--soft); border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:13px; }
  .ok { color:#15803d; font-weight:800; } .no { color:#b91c1c; font-weight:800; } .gv { color:var(--muted); font-weight:800; }
  .devs label { display:flex; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .devs input[type=text] { flex:1; min-width:0; font-family:inherit; font-size:14px; border:1px solid var(--line); border-radius:8px; padding:5px 8px; }
  .empty { padding:24px 0; text-align:center; color:var(--muted); }
  .warn { background:#fff7ed; border:1px solid #fed7aa; border-radius:12px; padding:10px 12px; margin-bottom:12px; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>공부기록</h1>
    <a class="back" href="index.html">← 앱으로</a>
  </div>

  <div class="bar">
    <button id="bPrev">◀</button>
    <input type="date" id="day">
    <button id="bNext">▶</button>
    <button id="bToday">오늘</button>
    <button id="bWeek">최근 7일</button>
    <button id="bDev">기기 설정</button>
  </div>

  <div id="devBox" class="card devs" style="display:none"></div>
  <div id="warn"></div>
  <div class="tabs" id="tabs"></div>
  <div id="out"><div class="empty">불러오는 중…</div></div>
</div>

<script>
var URL = 'https://pwbnbooyhujyzbmaydtp.supabase.co/rest/v1/';
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3Ym5ib295aHVqeXpibWF5ZHRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MTU0NTQsImV4cCI6MjA5NjM5MTQ1NH0.BwKTVgnswWqPlAdclwMpso6kcEA2x0d502CXv2DvBIE';
function H(x){ var h={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'}; for(var k in (x||{})) h[k]=x[k]; return h; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function kstDay(off){ var d=new Date(Date.now()+9*3600e3+(off||0)*864e5); return d.toISOString().slice(0,10); }
function addDay(s,n){ var d=new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function mins(sec){ sec=Math.round(sec||0); if(sec<60) return sec+'초'; var m=Math.round(sec/60); return m>=60 ? Math.floor(m/60)+'시간 '+(m%60)+'분' : m+'분'; }
function hhmm(ts){ var d=new Date(new Date(ts).getTime()+9*3600e3); return d.toISOString().slice(11,16); }
var MY_DEV = (function(){ try { return localStorage.getItem('amy_dev'); } catch(e){ return null; } })();

var state = { from:kstDay(0), to:kstDay(0), subj:'전체' };
var DEVS = [], ROWS = [], SUBJ_OF = {}, SUBJ_LIST = [];

// 과목 묶음은 첫 화면(index.html)의 과목 칸에서 읽는다 — 첫 화면에 단원이 늘면 저절로 따라간다.
function loadSubjects(){
  return fetch('index.html',{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
    var doc = new DOMParser().parseFromString(t,'text/html');
    doc.querySelectorAll('.subject-section').forEach(function(sec){
      var l = sec.querySelector('.subject-label .name-en'); if(!l) return;
      var name = l.textContent.trim();
      if (SUBJ_LIST.indexOf(name)<0) SUBJ_LIST.push(name);
      sec.querySelectorAll('a[href]').forEach(function(a){
        var h=(a.getAttribute('href')||'').split('#')[0].split('?')[0];
        if (/^[a-z0-9_]+\.html$/i.test(h) && !SUBJ_OF[h]) SUBJ_OF[h]=name;
      });
    });
  }).catch(function(){});
}
function subjOf(r){
  if (r.page==='index.html') return (r.detail && SUBJ_LIST.indexOf(r.detail)>=0) ? r.detail : '첫 화면';
  if (SUBJ_OF[r.page]) return SUBJ_OF[r.page];
  var p=r.page;
  if (/^y9m_/.test(p)) return '9학년 수학';
  if (/^y9_/.test(p)) return '9학년 과학';
  if (/^jenny/.test(p)) return '제니 영어공부';
  if (/^chinese/.test(p)) return '9학년 중국어';
  if (/^y9c_geography/.test(p)) return '9학년 지리';
  if (/^y9c_history/.test(p)) return '9학년 역사';
  if (/^y9c_english|^y9e_/.test(p)) return '9학년 영어';
  return '그 밖의 과목';
}
function unitName(r){
  if (r.page==='index.html') return '과목 첫 화면(진도표·클래스룸)';
  return (r.title||r.page).replace(/\s*·\s*AMY Study App\s*$/,'');
}

function loadDevs(){
  return fetch(URL+'amy_study_dev?select=*&order=first_seen.asc',{headers:H()}).then(function(r){return r.json();}).then(function(j){ DEVS = Array.isArray(j)?j:[]; });
}
function studentDevs(){ return DEVS.filter(function(d){return d.student;}).map(function(d){return d.dev;}); }

function loadRows(){
  var all=[], step=1000;
  function page(off){
    var q = URL+'amy_study_log?select=*&day=gte.'+state.from+'&day=lte.'+state.to+'&order=ts.asc';
    return fetch(q,{headers:H({Range:off+'-'+(off+step-1),'Range-Unit':'items'})}).then(function(r){return r.json();}).then(function(j){
      if(!Array.isArray(j)) return all;
      all = all.concat(j);
      return j.length===step ? page(off+step) : all;
    });
  }
  return page(0).then(function(a){ ROWS=a; });
}

function devLabel(d){
  var ua=d.ua||''; var kind = /iPhone/.test(ua)?'아이폰':/iPad/.test(ua)?'아이패드':/Android/.test(ua)?(/Mobile/.test(ua)?'안드로이드 폰':'안드로이드 태블릿'):/Mac/.test(ua)?'맥':/Windows/.test(ua)?'윈도우 PC':'기기';
  return kind;
}
function renderDevBox(){
  var box=document.getElementById('devBox');
  ROWS.forEach(function(r){ if(!DEVS.some(function(d){return d.dev===r.dev;})) DEVS.push({dev:r.dev,ua:'',name:'',student:false,first_seen:r.ts,_new:true}); });
  var h='<h2>어느 기기가 서정이 것인가요?</h2><div class="muted">서정이 기기에 체크하면 그 기기에서 한 공부만 기록에 나옵니다. 이름은 알아보기 쉽게 적어 두세요.</div>';
  DEVS.forEach(function(d){
    h+='<label><input type="checkbox" data-dev="'+esc(d.dev)+'" '+(d.student?'checked':'')+'>'+
       '<span style="white-space:nowrap">'+devLabel(d)+(d.dev===MY_DEV?' (지금 이 기기)':'')+'</span>'+
       '<input type="text" data-name="'+esc(d.dev)+'" value="'+esc(d.name||'')+'" placeholder="이름">'+
       '<span class="muted" style="white-space:nowrap">처음 '+esc((d.first_seen||'').slice(5,10))+'</span></label>';
  });
  if(!DEVS.length) h+='<div class="empty">아직 앱을 연 기기가 없습니다.</div>';
  box.innerHTML=h;
  box.querySelectorAll('input[type=checkbox]').forEach(function(c){
    c.onchange=function(){ saveDev(c.dataset.dev,{student:c.checked}); };
  });
  box.querySelectorAll('input[type=text]').forEach(function(t){
    t.onchange=function(){ saveDev(t.dataset.name,{name:t.value.trim()}); };
  });
}
function saveDev(dev,patch){
  var body={dev:dev}; for(var k in patch) body[k]=patch[k];
  fetch(URL+'amy_study_dev?on_conflict=dev',{method:'POST',headers:H({Prefer:'return=minimal,resolution=merge-duplicates'}),body:JSON.stringify(body)})
    .then(function(){ DEVS.forEach(function(d){ if(d.dev===dev) for(var k in patch) d[k]=patch[k]; }); render(); });
}

function render(){
  document.getElementById('day').value = state.to;
  document.getElementById('bWeek').classList.toggle('on', state.from!==state.to);
  var sd = studentDevs();
  var warn = document.getElementById('warn');
  warn.innerHTML = sd.length ? '' : '<div class="warn">서정이 기기가 아직 정해지지 않아 모든 기기의 기록을 보여 줍니다. [기기 설정]에서 서정이 기기에 체크해 주세요.</div>';
  var rows = sd.length ? ROWS.filter(function(r){return sd.indexOf(r.dev)>=0;}) : ROWS.slice();
  rows.forEach(function(r){ r._s = subjOf(r); });

  // 과목 탭: 기록이 있는 과목 먼저, 첫 화면 차례대로
  var has={}; rows.forEach(function(r){ has[r._s]=(has[r._s]||0)+(r.kind==='time'||r.kind==='listen'?r.n||0:0); });
  var names=['전체'].concat(SUBJ_LIST.concat(Object.keys(has).filter(function(s){return SUBJ_LIST.indexOf(s)<0;})).filter(function(s){return has[s]!=null;}));
  if (names.indexOf(state.subj)<0) state.subj='전체';
  var tb=document.getElementById('tabs');
  tb.innerHTML = names.map(function(n){ return '<button class="'+(n===state.subj?'on':'')+'" data-s="'+esc(n)+'">'+esc(n)+(n!=='전체'&&has[n]?' · '+mins(has[n]):'')+'</button>'; }).join('');
  tb.querySelectorAll('button').forEach(function(b){ b.onclick=function(){ state.subj=b.dataset.s; render(); }; });

  var out=document.getElementById('out');
  if(!rows.length){ out.innerHTML='<div class="empty">이 날짜에는 공부기록이 없습니다.</div>'; return; }
  out.innerHTML = state.subj==='전체' ? renderAll(rows) : renderSubject(rows.filter(function(r){return r._s===state.subj;}), state.subj);
}

function sum(rows,kind){ return rows.filter(function(r){return r.kind===kind;}).reduce(function(a,r){return a+(r.n||0);},0); }
function count(rows,kind){ return rows.filter(function(r){return r.kind===kind;}).length; }

function renderAll(rows){
  var by={}; rows.forEach(function(r){ (by[r._s]=by[r._s]||[]).push(r); });
  var total=sum(rows,'time')+sum(rows,'listen');
  var h='<div class="card"><h2>'+(state.from===state.to?state.to:state.from+' ~ '+state.to)+' 합계 '+mins(total)+'</h2>';
  h+='<table>';
  Object.keys(by).sort(function(a,b){return (sum(by[b],'time')+sum(by[b],'listen'))-(sum(by[a],'time')+sum(by[a],'listen'));}).forEach(function(s){
    var R=by[s], sp=R.filter(function(r){return r.kind==='spell';});
    var ok=sp.filter(function(r){return r.n===1;}).length;
    var d=[];
    if(sum(R,'listen')) d.push('듣기 '+mins(sum(R,'listen')));
    if(count(R,'mem')) d.push('외운 단어 '+count(R,'mem'));
    if(uniq(R,'say')) d.push('발음 들은 단어 '+uniq(R,'say'));
    if(sp.length) d.push('단어시험 '+ok+'/'+sp.length+' 맞음');
    if(count(R,'quiz')+count(R,'pick')) d.push('문제 '+(count(R,'quiz')+count(R,'pick')));
    h+='<tr><td><a href="#" data-s="'+esc(s)+'" style="color:inherit;font-weight:900">'+esc(s)+'</a>'+(d.length?'<div class="muted">'+d.join(' · ')+'</div>':'')+'</td><td class="num"><b>'+mins(sum(R,'time'))+'</b></td></tr>';
  });
  h+='</table></div>';
  // 시간 순서
  h+='<div class="card"><h2>한 순서</h2><table><tr><th>시각</th><th>과목</th><th>내용</th></tr>';
  timeline(rows).forEach(function(t){ h+='<tr><td>'+t.at+'</td><td>'+esc(t.s)+'</td><td>'+t.what+'</td></tr>'; });
  h+='</table></div>';
  setTimeout(function(){ document.querySelectorAll('#out a[data-s]').forEach(function(a){ a.onclick=function(e){ e.preventDefault(); state.subj=a.dataset.s; render(); window.scrollTo({top:0}); }; }); },0);
  return h;
}
function uniq(R,kind){ var o={}; R.forEach(function(r){ if(r.kind===kind) o[r.detail]=1; }); return Object.keys(o).length; }

// 같은 페이지에 이어서 머문 것은 한 줄로 묶는다
function timeline(rows){
  var list=[], cur=null;
  rows.forEach(function(r){
    var key=r._s+'|'+r.page;
    if(!cur || cur.key!==key || new Date(r.ts)-cur.last>20*60e3){
      cur={key:key,s:r._s,unit:unitName(r),start:r.ts,last:new Date(r.ts),sec:0,mem:0,say:{},spell:0,quiz:0,listen:0};
      list.push(cur);
    }
    cur.last=new Date(r.ts);
    if(r.kind==='time') cur.sec+=r.n||0;
    if(r.kind==='listen') cur.listen+=r.n||0;
    if(r.kind==='mem') cur.mem++;
    if(r.kind==='say') cur.say[r.detail]=1;
    if(r.kind==='spell') cur.spell++;
    if(r.kind==='quiz'||r.kind==='pick') cur.quiz++;
  });
  return list.map(function(c){
    var p=[esc(c.unit)];
    if(c.sec) p.push(mins(c.sec));
    if(c.listen) p.push('듣기 '+mins(c.listen));
    if(c.mem) p.push('외움 '+c.mem);
    var ns=Object.keys(c.say).length; if(ns) p.push('발음 '+ns+'단어');
    if(c.spell) p.push('단어시험 '+c.spell);
    if(c.quiz) p.push('문제 '+c.quiz);
    return {at:hhmm(c.start), s:c.s, what:p.join(' · ')};
  });
}

function renderSubject(R, s){
  var h='<div class="card"><h2>'+esc(s)+' · 화면 본 시간 '+mins(sum(R,'time'))+(sum(R,'listen')?' · 듣기 '+mins(sum(R,'listen')):'')+'</h2>';
  // 단원(페이지)별 · 화면(탭)별 시간
  var units={};
  R.forEach(function(r){ var u=unitName(r); (units[u]=units[u]||{rows:[],scr:{}}).rows.push(r); if(r.kind==='time'){ var k=r.page==='index.html'?'':(r.detail||''); units[u].scr[k]=(units[u].scr[k]||0)+(r.n||0);} });
  h+='<table><tr><th>단원</th><th>화면</th><th class="num">시간</th></tr>';
  Object.keys(units).forEach(function(u){
    var sc=units[u].scr, ks=Object.keys(sc);
    var ls=sum(units[u].rows,'listen');
    if(!ks.length && !ls){ h+='<tr><td>'+esc(u)+'</td><td></td><td class="num"></td></tr>'; return; }
    ks.forEach(function(k,i){ h+='<tr><td>'+(i?'':esc(u))+'</td><td style="white-space:nowrap">'+esc(k||'—')+'</td><td class="num">'+mins(sc[k])+'</td></tr>'; });
    if(ls) h+='<tr><td>'+(ks.length?'':esc(u))+'</td><td>듣기(화면 꺼도 셈)</td><td class="num">'+mins(ls)+'</td></tr>';
  });
  h+='</table></div>';

  Object.keys(units).forEach(function(u){
    var U=units[u].rows;
    var mem=U.filter(function(r){return r.kind==='mem';}), un=U.filter(function(r){return r.kind==='unmem';});
    var say={}; U.forEach(function(r){ if(r.kind==='say') say[r.detail]=(say[r.detail]||0)+1; });
    var sp={}; U.forEach(function(r){ if(r.kind==='spell'){ (sp[r.detail]=sp[r.detail]||[]).push(r.n); } });
    var qz=U.filter(function(r){return r.kind==='quiz';}), rt=U.filter(function(r){return r.kind==='rate';}), pk=U.filter(function(r){return r.kind==='pick';});
    var ls=U.filter(function(r){return r.kind==='listen';});
    if(!(mem.length||un.length||Object.keys(say).length||Object.keys(sp).length||qz.length||rt.length||pk.length||ls.length)) return;
    h+='<div class="card"><h2>'+esc(u)+'</h2>';
    if(mem.length){ h+='<h3>외운 단어로 체크 '+mem.length+'개</h3><div class="chips">'+mem.map(function(r){return '<span class="chip">'+esc(r.detail)+'</span>';}).join('')+'</div>'; }
    if(un.length){ h+='<h3>외움 표시를 다시 푼 단어 '+un.length+'개</h3><div class="chips">'+un.map(function(r){return '<span class="chip">'+esc(r.detail)+(r.n>1?' ('+r.n+')':'')+'</span>';}).join('')+'</div>'; }
    if(Object.keys(sp).length){
      h+='<h3>단어시험</h3><table><tr><th>단어</th><th>결과</th></tr>';
      Object.keys(sp).forEach(function(w){ h+='<tr><td>'+esc(w)+'</td><td>'+sp[w].map(function(n){ return n===1?'<span class="ok">맞음</span>':n===0?'<span class="no">틀림</span>':'<span class="gv">정답 봄</span>'; }).join(' ')+'</td></tr>'; });
      h+='</table>';
    }
    if(pk.length){
      h+='<h3>퀴즈</h3><table><tr><th>문제</th><th>결과</th></tr>';
      pk.forEach(function(r){ h+='<tr><td>'+esc(r.detail)+'</td><td>'+(r.n?'<span class="ok">맞음</span>':'<span class="no">틀림</span>')+'</td></tr>'; });
      h+='</table>';
    }
    if(qz.length||rt.length){
      h+='<h3>서술형 문제</h3><table><tr><th>문제</th><th>한 것</th></tr>';
      qz.forEach(function(r){ h+='<tr><td>'+esc(r.detail)+'</td><td>'+(r.n?'답 '+r.n+'자 쓰고 모범답안 봄':'답 안 쓰고 모범답안 봄')+'</td></tr>'; });
      rt.forEach(function(r){ var p=String(r.detail).split(' ⇒ '); h+='<tr><td>'+esc(p[0])+'</td><td>스스로 채점: '+esc(p[1]||'')+'</td></tr>'; });
      h+='</table>';
    }
    if(ls.length){ h+='<h3>듣기</h3><div class="chips">'+ls.map(function(r){return '<span class="chip">'+hhmm(r.ts)+' '+esc(r.detail)+' '+mins(r.n)+'</span>';}).join('')+'</div>'; }
    var sk=Object.keys(say);
    if(sk.length){ h+='<h3>발음 들은 단어 '+sk.length+'개</h3><div class="chips">'+sk.map(function(w){return '<span class="chip">'+esc(w)+(say[w]>1?' ×'+say[w]:'')+'</span>';}).join('')+'</div>'; }
    h+='</div>';
  });
  return h;
}

function reload(){
  document.getElementById('out').innerHTML='<div class="empty">불러오는 중…</div>';
  return Promise.all([loadDevs(), loadRows()]).then(function(){ render(); if(document.getElementById('devBox').style.display!=='none') renderDevBox(); })
    .catch(function(){ document.getElementById('out').innerHTML='<div class="empty">기록을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.</div>'; });
}
document.getElementById('bPrev').onclick=function(){ state.to=addDay(state.to,-1); state.from=state.to; reload(); };
document.getElementById('bNext').onclick=function(){ state.to=addDay(state.to,1); state.from=state.to; reload(); };
document.getElementById('bToday').onclick=function(){ state.to=state.from=kstDay(0); reload(); };
document.getElementById('bWeek').onclick=function(){ state.to=kstDay(0); state.from=addDay(state.to,-6); reload(); };
document.getElementById('day').onchange=function(e){ if(e.target.value){ state.to=state.from=e.target.value; reload(); } };
document.getElementById('bDev').onclick=function(){ var b=document.getElementById('devBox'); var show=b.style.display==='none'; b.style.display=show?'block':'none'; this.classList.toggle('on',show); if(show) renderDevBox(); };
loadSubjects().then(reload);
</script>
