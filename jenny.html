<!DOCTYPE html>
<html lang="ko">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💛 Jenny 영어공부</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>

    --bg: #fffbf2;
    --card: #ffffff;
    --accent: #f6a623;
    --accent2: #ffcc5c;
    --green: #3ecfb2;
    --red: #ff7a7a;
    --purple: #a78bfa;
    --blue: #60c4f8;
    --text: #4a3a1f;
    --muted: #c2a878;
    --shadow: rgba(246,166,35,0.14);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito','Noto Sans KR',sans-serif;
    min-height: 100vh;
    padding: 0 0 60px;
    background-image: radial-gradient(circle at 15% 12%, rgba(246,166,35,0.13) 0%, transparent 50%),
                      radial-gradient(circle at 85% 85%, rgba(255,204,92,0.13) 0%, transparent 50%);
  }
  header { text-align:center; padding: 30px 20px 18px; }
  .back {
    position: absolute; left: 14px; top: 18px;
    text-decoration:none; color: var(--accent); font-weight:800; font-size:14px;
    background:#fff; padding:6px 12px; border-radius:20px;
    box-shadow:0 2px 10px var(--shadow);
  }
  .emo {
    display:inline-block; background:#fff; border-radius:50%;
    width:72px; height:72px; line-height:72px; font-size:40px;
    box-shadow:0 4px 18px var(--shadow); margin-bottom:10px;
  }
  header h1 { font-size:26px; font-weight:900; margin-bottom:4px; letter-spacing:-0.5px; }
  header h1 .y { color: var(--accent); }
  header .tagline { font-size:13px; color:var(--muted); font-weight:700; }

  .container { max-width: 720px; margin: 0 auto; padding: 0 14px; }

  /* 탭 */
  .tabs {
    display:flex; gap:6px; background:#fff; padding:6px; border-radius:16px;
    box-shadow:0 2px 12px var(--shadow); margin-bottom:16px; position:sticky; top:8px; z-index:20;
  }
  .tab-btn {
    flex:1; border:none; background:transparent; padding:10px 4px; border-radius:11px;
    font-family:inherit; font-weight:800; font-size:14px; color:var(--muted); cursor:pointer;
    transition:all .18s;
  }
  .tab-btn.active { background:var(--accent); color:#fff; box-shadow:0 3px 10px var(--shadow); }

  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  /* Day 필터 */
  .day-filter { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .day-chip {
    border:none; background:#fff; color:var(--accent); font-family:inherit;
    font-weight:800; font-size:13px; padding:7px 13px; border-radius:20px; cursor:pointer;
    box-shadow:0 2px 8px var(--shadow); border:2px solid transparent; transition:all .15s;
  }
  .day-chip.active { background:var(--accent); color:#fff; }

  .search {
    width:100%; border:2px solid rgba(246,166,35,0.2); border-radius:14px;
    padding:11px 14px; font-family:inherit; font-size:15px; color:var(--text);
    margin-bottom:14px; background:#fff; outline:none;
  }
  .search:focus { border-color:var(--accent); }

  /* Day 섹션 */
  .day-head {
    font-size:15px; font-weight:900; color:var(--accent); margin:18px 4px 10px;
    display:flex; align-items:center; gap:8px;
  }
  .day-head::before { content:'📅'; }
  .day-head .cnt { font-size:12px; color:var(--muted); font-weight:700; }

  /* 단어 카드 */
  .wcard {
    background:var(--card); border-radius:16px; padding:14px 16px; margin-bottom:9px;
    box-shadow:0 2px 10px var(--shadow); border:2px solid rgba(246,166,35,0.1);
  }
  .wcard.hidden { display:none; }
  .wcard-top { display:flex; align-items:center; gap:10px; }
  .wcard-en { font-size:17px; font-weight:800; color:var(--text); flex:1; line-height:1.3; }
  .wcard-ko { font-size:14px; color:var(--accent); font-weight:700; margin-top:3px; }
  .spk {
    border:none; background:rgba(246,166,35,0.12); color:var(--accent);
    width:36px; height:36px; border-radius:50%; font-size:17px; cursor:pointer; flex-shrink:0;

  .wcard-ex {
    display:flex; align-items:center; gap:8px; margin-top:9px; padding-top:9px;
    border-top:1px dashed rgba(246,166,35,0.22);

  .spk.sm { width:30px; height:30px; font-size:14px; }

  .test-setup p { color:var(--muted); font-weight:700; font-size:14px; margin-bottom:14px; }

  .test-stats .no { color:var(--red); }

// ─── 발음 ───
// 방식: 폰 읽어주기(TTS)가 기기마다 안 되는 경우가 많아서,
//       진짜 음성 파일(Google 번역 발음)을 오디오로 직접 재생한다.
//       referer를 빼야 차단(404)되지 않음. 실패하면 폰 내장 음성으로 보조.
let _audio = null;
function speak(text) {
  const clean = text.replace(/~/g,'').replace(/\s*\/\s*/g,', ').trim();
  if (!clean) return;
  try {
    if (_audio) { _audio.pause(); _audio = null; }
    const url = 'https://translate.google.com/translate_tts?ie=UTF-8&tl=en-GB&client=tw-ob&q='
                + encodeURIComponent(clean.slice(0, 190));
    const a = new Audio();
    a.referrerPolicy = 'no-referrer';   // 핵심: referer 없어야 Google이 허용
    a.src = url;
    a.onerror = () => fallbackSpeak(clean);
    _audio = a;
    const p = a.play();
    if (p && p.catch) p.catch(() => fallbackSpeak(clean));
  } catch (e) {
    fallbackSpeak(clean);
  }
}
// 보조: 폰 내장 음성 (인터넷 안 될 때 등)
let _voices = [];
function loadVoices(){ if (window.speechSynthesis) _voices = window.speechSynthesis.getVoices() || []; }
if (window.speechSynthesis) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }
function normLang(l){ return (l || '').replace(/_/g,'-').toLowerCase(); }
function fallbackSpeak(text){
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.9;
  const en = _voices.filter(v => normLang(v.lang).startsWith('en'));
  const local = en.filter(v => v.localService);
  const pool = local.length ? local : en;
  const v = pool.find(x => normLang(x.lang)==='en-gb') || pool.find(x => normLang(x.lang)==='en-us') || pool[0];
  if (v) { u.voice = v; u.lang = normLang(v.lang); } else { u.lang = 'en-GB'; }
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
  setTimeout(() => { try { window.speechSynthesis.resume(); } catch(e){} }, 80);
}

function renderVocab() {
  const wrap = document.getElementById('vocab-list');
  const q = query.toLowerCase().trim();
  let html = '';
  DAYS.forEach(day => {
    if (vocabDay !== 'all' && vocabDay !== day) return;
    const items = DATA.filter(w => w.d === day && (
      !q || w.en.toLowerCase().includes(q) || w.ko.toLowerCase().includes(q) || w.ex.toLowerCase().includes(q)
    ));
    if (items.length === 0) return;
    html += `<div class="day-head">Day ${day} <span class="cnt">· ${items.length}개</span></div>`;
    items.forEach(w => {
      html += `<div class="wcard">
        <div class="wcard-top">
          <div>
            <div class="wcard-en">${esc(w.en)}</div>
            <div class="wcard-ko">${esc(w.ko)}</div>
          </div>
          <button class="spk" onclick="speak(${JSON.stringify(w.en)})" aria-label="단어 발음">🔊</button>
        </div>
        <div class="wcard-ex">
          <span class="txt">"${esc(w.ex)}"</span>
          <button class="spk sm" onclick="speak(${JSON.stringify(w.ex)})" aria-label="예문 발음">🔊</button>
        </div>
      </div>`;
    });
  });
  if (!html) html = `<p style="text-align:center;color:var(--muted);font-weight:700;padding:30px 0;">검색 결과가 없어요 🐣</p>`;
  wrap.innerHTML = html;
}

// Day 필터 버튼 생성
function buildDayFilter(containerId, onClick) {
  const c = document.getElementById(containerId);
  let html = `<button class="day-chip active" data-day="all">전체</button>`;
  DAYS.forEach(d => html += `<button class="day-chip" data-day="${d}">Day ${d}</button>`);
  c.innerHTML = html;
  c.querySelectorAll('.day-chip').forEach(b => b.addEventListener('click', () => {
    c.querySelectorAll('.day-chip').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    onClick(b.dataset.day === 'all' ? 'all' : parseInt(b.dataset.day));
  }));
}

buildDayFilter('day-filter', d => { vocabDay = d; renderVocab(); });
buildDayFilter('test-day-filter', d => { testDay = d; });

document.getElementById('search').addEventListener('input', e => { query = e.target.value; renderVocab(); });
renderVocab();

// ─── 테스트 (타이핑) ───
let testDay = 'all';
const test = { pool:[], cur:null, ok:0, no:0, answered:false };

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

// 채점용 정규화: 소문자, ~ 제거, 영숫자/공백만, 공백 정리
function norm(s){
  return s.toLowerCase().replace(/~/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
// 정답 후보들 (슬래시로 나뉜 것, 괄호 안 빼고/넣고 모두 인정)
function acceptedAnswers(en){
  const set = new Set();
  const add = s => { const n = norm(s); if (n) set.add(n); };
  en.split('/').forEach(part => { add(part); add(part.replace(/\(.*?\)/g,'')); });
  add(en); add(en.replace(/\(.*?\)/g,''));
  return set;
}
// 글자수 힌트: 각 단어 첫 글자만 보여주고 나머지는 _
function makeHint(s){
  return s.split(' ').map(word => {
    if (!/[A-Za-z]/.test(word)) return word;     // ~ , / 등은 그대로
    let shown = false, out = '';
    for (const ch of word){
      if (/[A-Za-z]/.test(ch)){ out += shown ? '_' : ch; shown = true; }
      else out += ch;
    }
    return out;
  }).join(' ');
}

function startTest() {
  const subset = DATA.filter(w => testDay === 'all' || w.d === testDay);
  test.pool = shuffle(subset);
  test.ok = 0; test.no = 0;
  document.getElementById('test-setup').style.display = 'none';
  document.getElementById('test-area').style.display = 'block';
  updateStats();
  nextQ();
}

function nextQ() {
  if (test.pool.length === 0) { finishTest(); return; }
  test.cur = test.pool.shift();
  test.answered = false;
  const w = test.cur;
  document.getElementById('t-day').textContent = 'Day ' + w.d;
  document.getElementById('t-ko').textContent = w.ko;
  document.getElementById('t-hint').textContent = makeHint(w.en);
  document.getElementById('t-fb').innerHTML = '';
  const input = document.getElementById('t-input');
  input.value = ''; input.disabled = false;
  input.className = 'sp-input';
  input.placeholder = '영어로 입력…';
  document.getElementById('t-actions').innerHTML =
    `<button class="big-btn" onclick="checkAnswer()">확인 ✓</button>
     <button class="big-btn alt" onclick="revealAnswer()">모르겠어요 👀</button>`;
  updateStats();
  setTimeout(() => input.focus(), 80);
}

function checkAnswer() {
  if (test.answered) return;
  const w = test.cur;
  const input = document.getElementById('t-input');
  const userVal = norm(input.value);
  if (!userVal) { input.focus(); return; }
  const correct = acceptedAnswers(w.en).has(userVal);
  test.answered = true;
  input.disabled = true;
  if (correct) {
    test.ok++;
    input.classList.add('ok');
    document.getElementById('t-fb').innerHTML = '<span class="good">정답이에요! 🎉</span>';
  } else {
    test.no++;
    input.classList.add('no');
    document.getElementById('t-fb').innerHTML =
      '<span class="bad">아쉬워요! 정답 👉</span><br>' +
      '<span class="ans">' + esc(w.en) + '</span><br>' +
      '<span class="ans-ko">' + esc(w.ko) + '</span>';
  }
  speak(w.en);
  document.getElementById('t-actions').innerHTML =
    `<button class="big-btn" onclick="speak(${JSON.stringify(w.en)})">🔊 다시 듣기</button>
     <button class="big-btn" onclick="nextQ()">다음 ▶︎</button>`;
  updateStats();
}

function revealAnswer() {
  if (test.answered) return;
  const w = test.cur;
  const input = document.getElementById('t-input');
  test.answered = true;
  test.no++;
  input.value = w.en; input.disabled = true; input.classList.add('no');
  document.getElementById('t-fb').innerHTML =
    '<span class="ans">' + esc(w.en) + '</span><br>' +
    '<span class="ans-ko">' + esc(w.ko) + '</span>';
  speak(w.en);
  document.getElementById('t-actions').innerHTML =
    `<button class="big-btn" onclick="speak(${JSON.stringify(w.en)})">🔊 다시 듣기</button>
     <button class="big-btn" onclick="nextQ()">다음 ▶︎</button>`;
  updateStats();
}

function finishTest() {
  const total = test.ok + test.no;
  document.getElementById('t-day').textContent = '';
  document.getElementById('t-ko').textContent = '🎉 끝!';
  document.getElementById('t-hint').textContent = '';
  document.getElementById('t-input').style.display = 'none';
  document.getElementById('t-fb').innerHTML =
    '<span class="good" style="font-size:18px;">맞은 개수 ' + test.ok + ' / ' + total + '</span>';
  document.getElementById('t-actions').innerHTML =
    `<button class="big-btn" onclick="resetTest()">다시 시작 🔁</button>`;
}

function resetTest() {
  document.getElementById('t-input').style.display = '';
  document.getElementById('test-area').style.display = 'none';
  document.getElementById('test-setup').style.display = 'block';
}

// 엔터로 확인/다음
document.getElementById('t-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); if (!test.answered) checkAnswer(); }
});

function updateStats() {
  document.getElementById('t-ok').textContent = test.ok;
  document.getElementById('t-no').textContent = test.no;
  const remaining = test.pool.length + (test.cur && !test.answered ? 1 : 0);
  document.getElementById('t-rem').textContent = remaining;
}
</script>

      reg.addEventListener('updatefound', function() {
        var newSW = reg.installing;
        if (!newSW) return;
        newSW.addEventListener('statechange', function() {
          if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
            newSW.postMessage({type: 'SKIP_WAITING'});
          }
        });
      });
      setInterval(function() { reg.update(); }, 30 * 60 * 1000);
    }).catch(function(e) {});
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (reloaded) return;
      reloaded = true;
      window.location.reload();
    });
  });
}
</script>
