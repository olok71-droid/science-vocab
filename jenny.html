<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💛 Jenny 영어공부</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fffbf2;
    --card: #ffffff;
    --accent: #f6a623;
    --accent2: #ffcc5c;
    --green: #3ecfb2;
    --red: #ff7a7a;
    --purple: #a78bfa;
    --blue: #60c4f8;
    --text: #4a3a1f;
    --muted: #c2a878;
    --shadow: rgba(246,166,35,0.14);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito','Noto Sans KR',sans-serif;
    min-height: 100vh;
    padding: 0 0 60px;
    background-image: radial-gradient(circle at 15% 12%, rgba(246,166,35,0.13) 0%, transparent 50%),
                      radial-gradient(circle at 85% 85%, rgba(255,204,92,0.13) 0%, transparent 50%);
  }
  header { text-align:center; padding: 48px 20px 16px; }
  .back {
    position: absolute; left: 14px; top: 18px;
    text-decoration:none; color: var(--accent); font-weight:800; font-size:14px;
    background:#fff; padding:6px 12px; border-radius:20px;
    box-shadow:0 2px 10px var(--shadow);
  }
  header h1 { font-size:26px; font-weight:900; margin-bottom:4px; letter-spacing:-0.5px; }
  header h1 .heart { font-size:20px; }
  header h1 .y { color: var(--accent); }
  header .tagline { font-size:13px; color:var(--muted); font-weight:700; }

  .container { max-width: 720px; margin: 0 auto; padding: 0 14px; }

  /* 탭 */
  .tabs {
    display:flex; gap:6px; background:#fff; padding:6px; border-radius:16px;
    box-shadow:0 2px 12px var(--shadow); margin-bottom:16px; position:sticky; top:8px; z-index:20;
  }
  .tab-btn {
    flex:1; border:none; background:transparent; padding:10px 4px; border-radius:11px;
    font-family:inherit; font-weight:800; font-size:14px; color:var(--muted); cursor:pointer;
    transition:all .18s;
  }
  .tab-btn.active { background:var(--accent); color:#fff; box-shadow:0 3px 10px var(--shadow); }

  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  /* Day 필터 */
  .day-filter { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .day-chip {
    border:none; background:#fff; color:var(--accent); font-family:inherit;
    font-weight:800; font-size:13px; padding:7px 13px; border-radius:20px; cursor:pointer;
    box-shadow:0 2px 8px var(--shadow); border:2px solid transparent; transition:all .15s;
  }
  .day-chip.active { background:var(--accent); color:#fff; }

  .search {
    width:100%; border:2px solid rgba(246,166,35,0.2); border-radius:14px;
    padding:11px 14px; font-family:inherit; font-size:15px; color:var(--text);
    margin-bottom:14px; background:#fff; outline:none;
  }
  .search:focus { border-color:var(--accent); }

  /* Day 섹션 */
  .day-head {
    font-size:15px; font-weight:900; color:var(--accent); margin:18px 2px 10px;
    display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap;
  }
  .day-head .cnt { font-size:12px; color:var(--muted); font-weight:700; }
  .dh-btns { display:flex; gap:5px; }

  /* 블라인드 버튼 (Day 줄 오른쪽) */
  .blind-btn {
    border:1.5px solid rgba(246,166,35,0.3); background:#fff; color:var(--muted);
    font-family:inherit; font-weight:800; font-size:11px; padding:5px 9px; border-radius:14px;
    cursor:pointer; transition:all .15s; white-space:nowrap;
  }
  .blind-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  /* 단어 줄 (좌 영어 | 우 한글) */
  .wrow {
    display:flex; align-items:center; gap:8px;
    background:var(--card); border-radius:13px; padding:11px 12px; margin-bottom:7px;
    box-shadow:0 1px 6px var(--shadow); border:1.5px solid rgba(246,166,35,0.1);
  }
  .wrow.hidden { display:none; }
  .w-en { flex:1.05; font-size:16px; font-weight:800; color:var(--text); line-height:1.25; min-width:0; }
  .w-ko { flex:1; font-size:14px; color:var(--accent); font-weight:700; line-height:1.25; min-width:0; }
  .spk {
    border:none; background:rgba(246,166,35,0.12); color:var(--accent);
    width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer; flex-shrink:0;
    transition:all .15s;
  }
  .spk:hover { background:var(--accent); color:#fff; }
  .spk.sm { width:28px; height:28px; font-size:13px; }

  /* 블라인드(가림) — 글자 숨기고 톡 누르면 잠깐 보임 */
  .cell { position:relative; cursor:default; }
  .cell.blinded { cursor:pointer; }
  .cell.blinded > span { filter:blur(6px); opacity:0.45; user-select:none; }
  .cell.blinded::after {
    content:'👀'; position:absolute; right:2px; top:50%; transform:translateY(-50%);
    font-size:12px; opacity:0.5;
  }
  .cell.blinded.peek > span { filter:none; opacity:1; }
  .cell.blinded.peek::after { content:''; }

  /* 예문 줄 (항상 보임) */
  .ex-row {
    display:flex; align-items:center; gap:8px;
    margin:-3px 0 9px 8px; padding:9px 12px;
    background:rgba(246,166,35,0.06); border-radius:11px;
    border-left:3px solid rgba(246,166,35,0.4);
  }
  .ex-en { flex:1.05; font-size:13.5px; color:#6a5a3a; font-style:italic; line-height:1.35; min-width:0; }
  .ex-ko { flex:1; font-size:12.5px; color:var(--muted); font-weight:600; line-height:1.35; min-width:0; }

  /* 테스트 */
  .test-setup { text-align:center; padding:10px 0 4px; }
  .test-setup p { color:var(--muted); font-weight:700; font-size:14px; margin-bottom:14px; }
  .big-btn {
    border:none; background:var(--accent); color:#fff; font-family:inherit; font-weight:800;
    font-size:16px; padding:13px 30px; border-radius:14px; cursor:pointer;
    box-shadow:0 4px 14px var(--shadow); transition:all .15s;
  }
  .big-btn:hover { transform:translateY(-2px); }
  .big-btn.alt { background:#fff; color:var(--accent); border:2px solid rgba(246,166,35,0.3); }

  .test-stats {
    display:flex; justify-content:center; gap:18px; margin-bottom:16px; font-weight:800; font-size:14px;
  }
  .test-stats .ok { color:var(--green); }
  .test-stats .no { color:var(--red); }
  .test-stats .rem { color:var(--muted); }

  .q-card {
    background:#fff; border-radius:18px; padding:22px 18px; box-shadow:0 4px 16px var(--shadow);
    border:2px solid rgba(246,166,35,0.12); text-align:center; margin-bottom:14px;
  }
  .q-day { font-size:12px; font-weight:800; color:var(--muted); margin-bottom:8px; }
  .q-ko { font-size:24px; font-weight:900; color:var(--text); margin-bottom:6px; line-height:1.3; }
  .q-sub { font-size:13px; color:var(--muted); font-weight:700; }

  /* 타이핑 시험 */
  .sp-hint {
    font-family:'Courier New',monospace; letter-spacing:2px; font-size:18px;
    color:var(--muted); font-weight:800; margin:12px 0 14px; line-height:1.5;
  }
  .sp-input {
    width:100%; border:2px solid rgba(246,166,35,0.3); border-radius:13px;
    padding:14px; font-family:inherit; font-size:18px; text-align:center;
    color:var(--text); background:#fff; outline:none; transition:all .12s;
  }
  .sp-input:focus { border-color:var(--accent); }
  .sp-input.ok { border-color:var(--green); background:rgba(62,207,178,0.08); }
  .sp-input.no { border-color:var(--red); background:rgba(255,122,122,0.08); }
  .sp-input:disabled { opacity:1; }
  .sp-feedback { min-height:26px; margin:12px 0; font-weight:800; font-size:16px; line-height:1.4; }
  .sp-feedback .good { color:var(--green); }
  .sp-feedback .bad  { color:var(--red); }
  .sp-feedback .ans  { color:var(--accent); font-size:19px; }
  .sp-feedback .ans-ko { color:var(--muted); font-size:13px; font-weight:700; }
  .sp-actions { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .next-row { text-align:center; margin-top:6px; }

  footer { text-align:center; padding:24px; color:var(--muted); font-size:11px; }
  footer span { color:var(--accent); }
</style>
</head>

<a class="back" href="index.html">← 메인</a>
<header>
  <h1><span class="heart">💛</span> <span class="y">Jenny</span> 영어공부</h1>

<div class="container">

        <div class="sp-feedback" id="t-fb"></div>
        <div class="sp-actions" id="t-actions"></div>
      </div>
    </div>
  </div>

</div>

<footer>💛 <span>Jenny 영어공부</span> · phrase - May</footer>

const DAYS = [1,2,3,4,5,6,7];
DATA.forEach((w, i) => { w.id = i; });   // 음성 파일 이름과 맞추기

// ─── 발음 ───
// 미리 받아둔 음성 파일(audio/jenny/)을 우리 사이트 안에서 직접 재생 → 어디서나 확실히 됨.
// (단어=w번호.mp3, 예문=e번호.mp3) 파일을 못 틀면 폰 내장 음성으로 보조.
function cleanText(t){ return t.replace(/~/g,'').replace(/\s*\/\s*/g,', ').trim(); }
let _audio = null;
function playClip(kind, id) {
  const w = DATA[id];
  const fb = () => { if (w) fallbackSpeak(cleanText(kind === 'e' ? w.ex : w.en)); };
  try {
    if (_audio) { _audio.pause(); _audio = null; }
    const a = new Audio('audio/jenny/' + kind + id + '.mp3');
    a.onerror = fb;
    _audio = a;
    const p = a.play();
    if (p && p.catch) p.catch(fb);
  } catch (e) {
    fb();
  }
}
// 보조: 폰 내장 음성 (인터넷 안 될 때 등)
let _voices = [];
function loadVoices(){ if (window.speechSynthesis) _voices = window.speechSynthesis.getVoices() || []; }
if (window.speechSynthesis) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }
function normLang(l){ return (l || '').replace(/_/g,'-').toLowerCase(); }
function fallbackSpeak(text){
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.9;
  const en = _voices.filter(v => normLang(v.lang).startsWith('en'));
  const local = en.filter(v => v.localService);
  const pool = local.length ? local : en;
  const v = pool.find(x => normLang(x.lang)==='en-gb') || pool.find(x => normLang(x.lang)==='en-us') || pool[0];
  if (v) { u.voice = v; u.lang = normLang(v.lang); } else { u.lang = 'en-GB'; }
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
  setTimeout(() => { try { window.speechSynthesis.resume(); } catch(e){} }, 80);
}

// ─── 탭 ───
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    window.scrollTo({top:0, behavior:'smooth'});
  });
});

// ─── 단어장 렌더 ───
let vocabDay = 'all';
let query = '';

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let blindEn = false, blindKo = false;   // 각각 켜기/끄기 토글

function toggleBlind(side) {
  if (side === 'en') blindEn = !blindEn; else blindKo = !blindKo;
  renderVocab();
}

// 가려진 칸 톡 누르면 잠깐 보임
function peek(el) {
  if (el.classList.contains('blinded')) el.classList.toggle('peek');
}

function cell(side, text) {
  const isBlind = (side === 'en') ? blindEn : blindKo;
  return `<div class="w-${side} cell${isBlind ? ' blinded' : ''}" onclick="peek(this)"><span>${esc(text)}</span></div>`;
}

function blindButtons() {
  return `<span class="dh-btns">
    <button class="blind-btn${blindEn ? ' active' : ''}" onclick="toggleBlind('en')">🇬🇧 영어가림</button>
    <button class="blind-btn${blindKo ? ' active' : ''}" onclick="toggleBlind('ko')">🇰🇷 한글가림</button>
  </span>`;
}

function renderVocab() {
  const wrap = document.getElementById('vocab-list');
  const q = query.toLowerCase().trim();
  let html = '';
  DAYS.forEach(day => {
    if (vocabDay !== 'all' && vocabDay !== day) return;
    const items = DATA.filter(w => w.d === day && (
      !q || w.en.toLowerCase().includes(q) || w.ko.toLowerCase().includes(q) || w.ex.toLowerCase().includes(q)
    ));
    if (items.length === 0) return;
    html += `<div class="day-head"><span class="dh-title">📅 Day ${day} <span class="cnt">· ${items.length}개</span></span>${blindButtons()}</div>`;
    items.forEach(w => {
      html += `<div class="wrow">
        ${cell('en', w.en)}
        ${cell('ko', w.ko)}
        <button class="spk" onclick="playClip('w', ${w.id})" aria-label="단어 발음">🔊</button>
      </div>
      <div class="ex-row">
        <div class="ex-en cell${blindEn ? ' blinded' : ''}" onclick="peek(this)"><span>${esc(w.ex)}</span></div>
        <div class="ex-ko cell${blindKo ? ' blinded' : ''}" onclick="peek(this)"><span>${esc(w.exko || '')}</span></div>
        <button class="spk sm" onclick="playClip('e', ${w.id})" aria-label="예문 발음">🔊</button>
      </div>`;
    });
  });
  if (!html) html = `<p style="text-align:center;color:var(--muted);font-weight:700;padding:30px 0;">검색 결과가 없어요 🐣</p>`;
  wrap.innerHTML = html;
}

// Day 필터 버튼 생성
function buildDayFilter(containerId, onClick) {
  const c = document.getElementById(containerId);
  let html = `<button class="day-chip active" data-day="all">전체</button>`;
  DAYS.forEach(d => html += `<button class="day-chip" data-day="${d}">Day ${d}</button>`);
  c.innerHTML = html;
  c.querySelectorAll('.day-chip').forEach(b => b.addEventListener('click', () => {
    c.querySelectorAll('.day-chip').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    onClick(b.dataset.day === 'all' ? 'all' : parseInt(b.dataset.day));
  }));
}

buildDayFilter('day-filter', d => { vocabDay = d; renderVocab(); });
buildDayFilter('test-day-filter', d => { testDay = d; });

document.getElementById('search').addEventListener('input', e => { query = e.target.value; renderVocab(); });
renderVocab();

// ─── 테스트 (타이핑) ───
let testDay = 'all';
const test = { pool:[], cur:null, ok:0, no:0, answered:false };

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

// 채점용 정규화: 소문자, ~ 제거, 영숫자/공백만, 공백 정리
function norm(s){
  return s.toLowerCase().replace(/~/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
// 정답 후보들 (슬래시로 나뉜 것, 괄호 안 빼고/넣고 모두 인정)
function acceptedAnswers(en){
  const set = new Set();
  const add = s => { const n = norm(s); if (n) set.add(n); };
  en.split('/').forEach(part => { add(part); add(part.replace(/\(.*?\)/g,'')); });
  add(en); add(en.replace(/\(.*?\)/g,''));
  return set;
}
// 글자수 힌트: 각 단어 첫 글자만 보여주고 나머지는 _
function makeHint(s){
  return s.split(' ').map(word => {
    if (!/[A-Za-z]/.test(word)) return word;     // ~ , / 등은 그대로
    let shown = false, out = '';
    for (const ch of word){
      if (/[A-Za-z]/.test(ch)){ out += shown ? '_' : ch; shown = true; }
      else out += ch;
    }
    return out;
  }).join(' ');
}

function startTest() {
  const subset = DATA.filter(w => testDay === 'all' || w.d === testDay);
  test.pool = shuffle(subset);
  test.ok = 0; test.no = 0;
  document.getElementById('test-setup').style.display = 'none';
  document.getElementById('test-area').style.display = 'block';
  updateStats();
  nextQ();
}

function nextQ() {
  if (test.pool.length === 0) { finishTest(); return; }
  test.cur = test.pool.shift();
  test.answered = false;
  const w = test.cur;
  document.getElementById('t-day').textContent = 'Day ' + w.d;
  document.getElementById('t-ko').textContent = w.ko;
  document.getElementById('t-hint').textContent = makeHint(w.en);
  document.getElementById('t-fb').innerHTML = '';
  const input = document.getElementById('t-input');
  input.value = ''; input.disabled = false;
  input.className = 'sp-input';
  input.placeholder = '영어로 입력…';
  document.getElementById('t-actions').innerHTML =
    `<button class="big-btn" onclick="checkAnswer()">확인 ✓</button>
     <button class="big-btn alt" onclick="revealAnswer()">모르겠어요 👀</button>`;
  updateStats();
  setTimeout(() => input.focus(), 80);
}

function checkAnswer() {
  if (test.answered) return;
  const w = test.cur;
  const input = document.getElementById('t-input');
  const userVal = norm(input.value);
  if (!userVal) { input.focus(); return; }
  const correct = acceptedAnswers(w.en).has(userVal);
  test.answered = true;
  input.disabled = true;
  if (correct) {
    test.ok++;
    input.classList.add('ok');
    document.getElementById('t-fb').innerHTML = '<span class="good">정답이에요! 🎉</span>';
  } else {
    test.no++;
    input.classList.add('no');
    document.getElementById('t-fb').innerHTML =
      '<span class="bad">아쉬워요! 정답 👉</span><br>' +
      '<span class="ans">' + esc(w.en) + '</span><br>' +
      '<span class="ans-ko">' + esc(w.ko) + '</span>';
  }
  playClip('w', w.id);
  document.getElementById('t-actions').innerHTML =
    `<button class="big-btn" onclick="playClip('w', ${w.id})">🔊 다시 듣기</button>
     <button class="big-btn" onclick="nextQ()">다음 ▶︎</button>`;
  updateStats();
}

function revealAnswer() {
  if (test.answered) return;
  const w = test.cur;
  const input = document.getElementById('t-input');
  test.answered = true;
  test.no++;
  input.value = w.en; input.disabled = true; input.classList.add('no');
  document.getElementById('t-fb').innerHTML =
    '<span class="ans">' + esc(w.en) + '</span><br>' +
    '<span class="ans-ko">' + esc(w.ko) + '</span>';
  playClip('w', w.id);
  document.getElementById('t-actions').innerHTML =
    `<button class="big-btn" onclick="playClip('w', ${w.id})">🔊 다시 듣기</button>
     <button class="big-btn" onclick="nextQ()">다음 ▶︎</button>`;
  updateStats();
}

function finishTest() {
  const total = test.ok + test.no;
  document.getElementById('t-day').textContent = '';
  document.getElementById('t-ko').textContent = '🎉 끝!';
  document.getElementById('t-hint').textContent = '';
  document.getElementById('t-input').style.display = 'none';
  document.getElementById('t-fb').innerHTML =
    '<span class="good" style="font-size:18px;">맞은 개수 ' + test.ok + ' / ' + total + '</span>';
  document.getElementById('t-actions').innerHTML =
    `<button class="big-btn" onclick="resetTest()">다시 시작 🔁</button>`;
}

function resetTest() {
  document.getElementById('t-input').style.display = '';
  document.getElementById('test-area').style.display = 'none';
  document.getElementById('test-setup').style.display = 'block';
}

// 엔터로 확인/다음
document.getElementById('t-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); if (!test.answered) checkAnswer(); }
});

function updateStats() {
  document.getElementById('t-ok').textContent = test.ok;
  document.getElementById('t-no').textContent = test.no;
  const remaining = test.pool.length + (test.cur && !test.answered ? 1 : 0);
  document.getElementById('t-rem').textContent = remaining;
}
</script>
