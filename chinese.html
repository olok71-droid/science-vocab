<style>
  :root{
    --bg:#fff5f5; --card:#ffffff; --accent:#e23a3a; --accent2:#ff8a8a;
    --gold:#f6b73c; --green:#3ecfb2; --blue:#60c4f8;

  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Nunito','Noto Sans KR',sans-serif; min-height:100vh; padding:0 0 70px;
    background-image:radial-gradient(circle at 15% 12%,rgba(226,58,58,0.10) 0%,transparent 50%),
                     radial-gradient(circle at 85% 85%,rgba(246,183,60,0.12) 0%,transparent 50%);
  }
  header{text-align:center; padding:28px 20px 14px;}
  .back{position:absolute; left:14px; top:18px; text-decoration:none; color:var(--accent);
    font-weight:800; font-size:14px; background:#fff; padding:6px 12px; border-radius:20px; box-shadow:0 2px 10px var(--shadow);}
  .emo{display:inline-block; background:#fff; border-radius:50%; width:74px; height:74px; line-height:74px;
    font-size:42px; box-shadow:0 4px 18px var(--shadow); margin-bottom:10px;}
  header h1{font-size:26px; font-weight:900; margin-bottom:4px;}
  header h1 .y{color:var(--accent);}
  header .tagline{font-size:13px; color:var(--muted); font-weight:700;}
  .container{max-width:720px; margin:0 auto; padding:0 14px;}

  .tabs{display:flex; gap:6px; background:#fff; padding:6px; border-radius:16px;
    box-shadow:0 2px 12px var(--shadow); margin-bottom:16px; position:sticky; top:8px; z-index:20;}
  .tab-btn{flex:1; border:none; background:transparent; padding:10px 4px; border-radius:11px;
    font-family:inherit; font-weight:800; font-size:13.5px; color:var(--muted); cursor:pointer; transition:all .18s;}
  .tab-btn.active{background:var(--accent); color:#fff; box-shadow:0 3px 10px var(--shadow);}
  .tab-panel{display:none;} .tab-panel.active{display:block;}

  .topic-filter{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
  .topic-chip{border:none; background:#fff; color:var(--accent); font-family:inherit; font-weight:800;
    font-size:13px; padding:7px 13px; border-radius:20px; cursor:pointer; box-shadow:0 2px 8px var(--shadow); transition:all .15s;}
  .topic-chip.active{background:var(--accent); color:#fff;}

  .topic-head{font-size:15px; font-weight:900; color:var(--accent); margin:18px 4px 10px; display:flex; align-items:center; gap:8px;}
  .topic-head::before{content:'🀄';}
  .topic-head .cnt{font-size:12px; color:var(--muted); font-weight:700;}

  /* 단어 카드 — 한자 크게, 탭하면 소리 */
  .ccard{background:var(--card); border-radius:18px; padding:14px 16px; margin-bottom:10px;
    box-shadow:0 2px 10px var(--shadow); border:2px solid rgba(226,58,58,0.10);
    display:flex; align-items:center; gap:14px; cursor:pointer; transition:all .12s;}
  .ccard:active{transform:scale(0.98);}
  .ccard.playing{border-color:var(--accent); background:#fff0f0;}
  .ccard .hz{font-family:'Noto Sans SC','Noto Sans KR',sans-serif; font-size:38px; font-weight:900;
    color:var(--text); line-height:1; min-width:64px; text-align:center;}
  .ccard .mid{flex:1;}
  .ccard .py{font-size:18px; font-weight:800; color:var(--accent); letter-spacing:.3px;}
  .ccard .ko{font-size:14px; color:#8a6a6a; font-weight:700; margin-top:3px;}
  .ccard .spk{border:none; background:var(--accent); color:#fff; width:46px; height:46px; border-radius:50%;
    font-size:22px; cursor:pointer; flex-shrink:0; box-shadow:0 3px 10px var(--shadow);}

  .hint{background:#fff; border-radius:14px; padding:12px 15px; margin-bottom:14px; font-size:13px;
    color:#8a6a6a; font-weight:700; box-shadow:0 2px 8px var(--shadow); line-height:1.5;}
  .hint b{color:var(--accent);}

  /* 듣기 퀴즈 */
  .quiz-setup{text-align:center; padding:14px 0;}
  .quiz-setup p{color:var(--muted); font-weight:700; font-size:14px; margin-bottom:14px; line-height:1.6;}
  .big-btn{border:none; background:var(--accent); color:#fff; font-family:inherit; font-weight:800;
    font-size:16px; padding:13px 30px; border-radius:14px; cursor:pointer; box-shadow:0 4px 14px var(--shadow); transition:all .15s;}
  .big-btn:hover{transform:translateY(-2px);} .big-btn.alt{background:#fff; color:var(--accent); border:2px solid rgba(226,58,58,0.3);}
  .quiz-stats{display:flex; justify-content:center; gap:18px; margin-bottom:16px; font-weight:800; font-size:14px;}
  .quiz-stats .ok{color:var(--green);} .quiz-stats .no{color:var(--accent);} .quiz-stats .rem{color:var(--muted);}

    font-size:42px; cursor:pointer; box-shadow:0 6px 18px var(--shadow); margin-bottom:8px;}
  .q-ask{font-size:15px; font-weight:800; color:var(--muted); margin:10px 0 16px;}
  .q-choices{display:flex; flex-direction:column; gap:9px;}
  .choice{border:2px solid rgba(226,58,58,0.18); background:#fff; color:var(--text); font-family:inherit;
    font-weight:800; font-size:17px; padding:14px; border-radius:14px; cursor:pointer; transition:all .12s;}
  .choice:hover{border-color:var(--accent);}

  .choice.wrong{background:rgba(226,58,58,0.1); border-color:var(--accent); color:var(--accent);}

  .yt-link{display:flex; align-items:center; gap:12px; background:#fff; border-radius:16px; padding:15px 16px;

// ── 발음: 미리 받은 mp3 재생 (audio/chinese/c{id}.mp3), 안 되면 폰 음성 보조 ──
let _audio = null, _playingEl = null;
function playClip(id, el){
  const d = DATA[id];
  if (_playingEl) _playingEl.classList.remove('playing');
  if (el){ el.classList.add('playing'); _playingEl = el; }
  const fb = () => { if (d) fallbackSpeak(d.hz); };
  try{
    if (_audio){ _audio.pause(); _audio = null; }
    const a = new Audio('audio/chinese/c' + id + '.mp3');
    a.onerror = fb;
    a.onended = () => { if (el) el.classList.remove('playing'); };
    _audio = a;
    const p = a.play();
    if (p && p.catch) p.catch(fb);
  }catch(e){ fb(); }
}
let _voices = [];
function loadVoices(){ if (window.speechSynthesis) _voices = window.speechSynthesis.getVoices() || []; }
if (window.speechSynthesis){ loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }
function normLang(l){ return (l||'').replace(/_/g,'-').toLowerCase(); }
function fallbackSpeak(text){
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.85;
  const zh = _voices.filter(v => normLang(v.lang).startsWith('zh'));
  const local = zh.filter(v => v.localService);
  const pool = local.length ? local : zh;
  const v = pool.find(x => normLang(x.lang).startsWith('zh-cn')) || pool[0];
  if (v){ u.voice = v; u.lang = normLang(v.lang); } else { u.lang = 'zh-CN'; }
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
  setTimeout(() => { try{ window.speechSynthesis.resume(); }catch(e){} }, 80);
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── 듣고 배우기 ──
let learnTopic = 'all';
function renderLearn(){
  const wrap = document.getElementById('learn-list');
  let html = '';
  TOPICS.forEach(tp => {
    if (learnTopic !== 'all' && learnTopic !== tp) return;
    const items = DATA.filter(d => d.t === tp);
    html += `<div class="topic-head">${esc(tp)} <span class="cnt">· ${items.length}개</span></div>`;
    items.forEach(d => {
      html += `<div class="ccard" onclick="playClip(${d.id}, this)">
        <div class="hz">${esc(d.hz)}</div>
        <div class="mid">
          <div class="py">${esc(d.py)}</div>
          <div class="ko">${esc(d.ko)}</div>
        </div>
        <button class="spk" onclick="event.stopPropagation(); playClip(${d.id}, this.closest('.ccard'))" aria-label="발음">🔊</button>
      </div>`;
    });
  });
  wrap.innerHTML = html;
}
function buildTopicFilter(containerId, onClick){
  const c = document.getElementById(containerId);
  let html = `<button class="topic-chip active" data-tp="all">전체</button>`;
  TOPICS.forEach(tp => html += `<button class="topic-chip" data-tp="${esc(tp)}">${esc(tp)}</button>`);
  c.innerHTML = html;
  c.querySelectorAll('.topic-chip').forEach(b => b.addEventListener('click', () => {
    c.querySelectorAll('.topic-chip').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    onClick(b.dataset.tp);
  }));
}
buildTopicFilter('topic-filter', tp => { learnTopic = tp; renderLearn(); });
buildTopicFilter('quiz-topic-filter', tp => { quizTopic = tp; });
renderLearn();

// ── 듣기 퀴즈 (소리 듣고 뜻 고르기) ──
let quizTopic = 'all';
const quiz = { pool:[], cur:null, ok:0, no:0, answered:false };
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function startQuiz(){
  const subset = DATA.filter(d => quizTopic === 'all' || d.t === quizTopic);
  if (subset.length < 3){ alert('이 주제는 문제가 너무 적어요. 다른 주제나 전체를 골라요!'); return; }
  quiz.pool = shuffle(subset); quiz.ok = 0; quiz.no = 0;
  document.getElementById('quiz-setup').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  updateQuizStats(); nextQuiz();
}
function nextQuiz(){
  if (quiz.pool.length === 0){ finishQuiz(); return; }
  quiz.cur = quiz.pool.shift(); quiz.answered = false;
  const d = quiz.cur;
  document.getElementById('q-reveal').innerHTML = '';
  document.getElementById('q-next').style.display = 'none';
  // 보기 3개: 정답 + 같은류 오답 2개
  const others = shuffle(DATA.filter(x => x.id !== d.id)).slice(0, 2);
  const choices = shuffle([d, ...others]);
  const cwrap = document.getElementById('q-choices');
  cwrap.innerHTML = choices.map(c =>
    `<button class="choice" onclick="answerQuiz(${c.id}, this)">${esc(c.ko)}</button>`).join('');
  document.getElementById('q-play').onclick = () => playClip(d.id);
  updateQuizStats();
  setTimeout(() => playClip(d.id), 350);  // 문제 나오면 자동으로 한 번 들려주기
}
function answerQuiz(chosenId, el){
  if (quiz.answered) return;
  quiz.answered = true;
  const d = quiz.cur;
  const correct = chosenId === d.id;
  document.querySelectorAll('.choice').forEach(b => b.disabled = true);
  if (correct){ quiz.ok++; el.classList.add('correct'); }
  else {
    quiz.no++; el.classList.add('wrong');
    document.querySelectorAll('.choice').forEach(b => {
      if (b.textContent === d.ko) b.classList.add('correct');
    });
  }
  document.getElementById('q-reveal').innerHTML =
    `<span class="hz">${esc(d.hz)}</span> &nbsp; <span class="py">${esc(d.py)}</span><br>` +
    `<span style="color:#8a6a6a;font-weight:700;">${esc(d.ko)}</span>`;
  document.getElementById('q-next').style.display = '';
  playClip(d.id);
  updateQuizStats();
}
function finishQuiz(){
  const total = quiz.ok + quiz.no;
  document.getElementById('quiz-area').innerHTML =
    `<div class="q-card">
       <div style="font-size:46px;margin-bottom:8px;">🎉</div>
       <div style="font-size:22px;font-weight:900;color:var(--accent);margin-bottom:6px;">잘했어요!</div>
       <div style="font-size:18px;font-weight:800;color:var(--green);">맞은 개수 ${quiz.ok} / ${total}</div>
       <div style="margin-top:16px;"><button class="big-btn" onclick="resetQuiz()">다시 하기 🔁</button></div>
     </div>`;
}
function resetQuiz(){ location.reload(); }
function updateQuizStats(){
  document.getElementById('q-ok').textContent = quiz.ok;
  document.getElementById('q-no').textContent = quiz.no;
  const rem = quiz.pool.length + (quiz.cur && !quiz.answered ? 1 : 0);
  document.getElementById('q-rem').textContent = rem;
}

// ── 유튜브 ──
document.getElementById('yt-list').innerHTML = YT.map(v =>
  `<a class="yt-link" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(v.q)}">
     <span class="pic">▶️</span><span>${esc(v.label)}</span><span class="go">보기</span>
   </a>`).join('');
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').then(function(reg) {
      reg.addEventListener('updatefound', function() {
        var newSW = reg.installing; if (!newSW) return;
        newSW.addEventListener('statechange', function() {
          if (newSW.state === 'installed' && navigator.serviceWorker.controller) newSW.postMessage({type:'SKIP_WAITING'});
        });
      });
      setInterval(function() { reg.update(); }, 30 * 60 * 1000);
    }).catch(function(e) {});
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (reloaded) return; reloaded = true; window.location.reload();
    });
  });
}
</script>
